# Release pipeline: tag v* → GitHub release with signed checksums, and
# a brew cask pushed to lbagic/homebrew-tap when TAP_GITHUB_TOKEN is set.
# The release carries Regrow.app.zip, which the release workflow builds
# and signs before goreleaser runs. Run locally with `scripts/app.sh
# release`, then `goreleaser release --snapshot --clean --skip=sign`, to
# verify without publishing.
version: 2

project_name: regrow

builds:
  - main: ./cmd/regrow
    binary: regrow
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # No version in the name: install.sh fetches releases/latest/download/<name>.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./app/.build/dist/Regrow.app.zip

# Keyless cosign signature over the checksum file: anyone can verify
# the release against the GitHub Actions OIDC identity, no Apple
# certificate needed for a CLI installed via brew.
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

homebrew_casks:
  - repository:
      owner: lbagic
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # An unset secret reaches the job as an empty string, which isEnvSet
    # reads as unset.
    skip_upload: '{{ if isEnvSet "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/lbagic/regrow
    description: "Disk cleaner that knows what everything is and how it regenerates"
    license: MIT
    # The binary is not Apple-notarized (CLI via brew, no dev cert):
    # strip the quarantine bit so Gatekeeper doesn't block it.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/regrow"]
          end

changelog:
  use: github
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  extra_files:
    - glob: ./app/.build/dist/Regrow.app.zip
  footer: |
    Nothing is removed before you confirm a plan (at the prompt, with
    --yes, or in the app), except by `regrow prune go-build --yes` and by
    autotrim, which is off until you turn it on. Every action is
    journaled before it runs; Trash moves are restorable with
    `regrow undo`, and docs/RULES.md says how each rule removes and how
    it comes back.
