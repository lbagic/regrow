<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>regrow</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #fafbf8; --panel: #eff2ec; --ink: #18211b; --ink-2: #56635a; --ink-3: #88948b;
  --line: #d9dfd6; --line-strong: #c3ccc0;
  --accent: #1e6a45; --accent-soft: #ddebdf; --on-accent: #ffffff;
  --caution: #9a5b00; --danger: #b3261e; --on-danger: #ffffff;
  --taken: #7b887f; --purge: #b3beb5; --track: #e2e7df;
  --b-now: #3280de; --b-trash: #039868; --b-export: #c2780f; --b-shown: #4a3ba8; --b-macos: #da6e97;
  --serif: ui-serif, "New York", Georgia, serif;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131714; --panel: #1b211c; --ink: #e6ece5; --ink-2: #9daa9f; --ink-3: #6e7a71;
    --line: #2b332d; --line-strong: #3c463e;
    --accent: #78c79a; --accent-soft: #1f3327; --on-accent: #0e1a12;
    --caution: #e0a84a; --danger: #f08a80; --on-danger: #2a0f0c;
    --taken: #8d9a90; --purge: #56625a; --track: #2a322c;
    --b-now: #4795f4; --b-trash: #30ac7d; --b-export: #d98f2e; --b-shown: #6456b5; --b-macos: #b53266;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #131714; --panel: #1b211c; --ink: #e6ece5; --ink-2: #9daa9f; --ink-3: #6e7a71;
  --line: #2b332d; --line-strong: #3c463e;
  --accent: #78c79a; --accent-soft: #1f3327; --on-accent: #0e1a12;
  --caution: #e0a84a; --danger: #f08a80; --on-danger: #2a0f0c;
  --taken: #8d9a90; --purge: #56625a; --track: #2a322c;
  --b-now: #4795f4; --b-trash: #30ac7d; --b-export: #d98f2e; --b-shown: #6456b5; --b-macos: #b53266;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 13px/1.4 var(--sans);
  display: grid; grid-template: 42px minmax(0, 1fr) minmax(60px, auto) / 196px minmax(0, 1fr); overflow: hidden;
  -webkit-font-smoothing: antialiased; cursor: default; -webkit-user-select: none;
}
h1, h2, h3, h4, p, dl, dd, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; border-radius: 3px; padding: 0; cursor: default; }
svg { width: 14px; height: 14px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="checkbox"] { accent-color: var(--accent); margin: 0; width: 15px; height: 15px; }
.mono { font: 12px/1.5 var(--mono); -webkit-user-select: text; cursor: text; }
/* the page's words can be selected and copied; its controls cannot */
.page { -webkit-user-select: text; }
.page button, .page input, .page label, .page svg { -webkit-user-select: none; }
.page .link.copy { margin: 0 0 0 8px; font-family: var(--sans); vertical-align: 1px; }
.cmd { display: block; margin: 4px 0; }
.cmd .mono { color: var(--ink); }
.nb { white-space: nowrap; }
.unit { font-weight: 400; color: var(--ink-2); }
.err { color: var(--danger); overflow-wrap: anywhere; white-space: pre-wrap; }
.link { color: var(--accent); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.link:disabled { color: var(--ink-3); }
.grow { flex: 1; }

/* one colour per total, on every mark that stands for it */
.frees_now { background: var(--b-now); }
.after_trash { background: var(--b-trash); }
.exported { background: var(--b-export); }
.shown_only { background: var(--b-shown); }
.macos_managed { background: var(--b-macos); }
.taken { background: var(--taken); }
.purge { background: var(--purge); }
.free { background: var(--track); }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.bar { display: block; height: 6px; background: linear-gradient(var(--line-strong), var(--line-strong)) 0 50% / 100% 1px no-repeat; }
.bar i { display: block; height: 100%; min-width: 2px; border-radius: 0 3px 3px 0; box-shadow: 2px 0 0 var(--under, var(--paper)); }

.top { display: flex; align-items: center; gap: 12px; padding: 0 32px; border-bottom: 1px solid var(--line); }
.top h1 { font: 600 17px/1 var(--serif); letter-spacing: -.005em; }
.top .status { color: var(--ink-2); font-size: 12px; }
.progress { width: 120px; height: 4px; border-radius: 2px; background: var(--track); }
.progress i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

.page { overflow: auto; min-height: 0; padding: 16px 32px 22px; }

/* headline, meter, figures */
.lead h2 { font: 600 23px/1.2 var(--serif); letter-spacing: -.012em; }
.lead .say { font: 400 14.5px/1.5 var(--serif); margin-top: 6px; max-width: 74ch; }
.lead .say b { font-family: var(--sans); font-size: 13.5px; font-weight: 650; }
.lead .say .sw { margin-right: 5px; vertical-align: 1px; }
.lead .err { margin-top: 6px; }
.meter { display: flex; gap: 2px; height: 6px; margin: 11px 0 8px; }
.meter i { display: block; height: 100%; min-width: 3px; }
.meter i:first-child { border-radius: 3px 0 0 3px; }
.meter .free { border-radius: 0 3px 3px 0; flex: 1; }
.figures { display: flex; gap: 22px; font-size: 12.5px; color: var(--ink-2); }
.figures span { display: inline-flex; align-items: baseline; gap: 6px; }
.figures i { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
.figures b { color: var(--ink); font-weight: 650; }
.aside { margin-top: 7px; color: var(--ink-2); font-size: 12px; }

/* the totals: a filled track, since they have a scale of their own; four, and a fifth when a scan holds a volume export */
.four { display: grid; gap: 20px; margin-top: 16px; }
.four .rule { height: 4px; background: var(--track); border-radius: 2px; }
.four .rule i { display: block; height: 100%; min-width: 3px; border-radius: 2px; }
.four b { display: block; font-size: 20px; font-weight: 650; letter-spacing: -.015em; margin-top: 7px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.four b .unit { font-size: 13px; }
.four b.wait { color: var(--ink-3); font-size: 15px; font-weight: 500; line-height: 23px; letter-spacing: 0; }
.four .name { display: flex; align-items: baseline; gap: 6px; color: var(--ink-2); font-size: 12.5px; }
.apart { margin-top: 7px; color: var(--ink-3); font-size: 12px; }

.note { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 6px 11px; border-radius: 8px; background: var(--panel); font-size: 12.5px; line-height: 1.45; }
.note svg { color: var(--caution); margin-top: 2px; }
.note .link { margin-left: auto; padding-left: 12px; }
.link.wait { color: var(--ink-2); font-weight: 400; }
.cost.aerials .link { margin-left: 8px; }
.note .line { display: block; }
.note .line:not(:first-child) { margin-top: 4px; }
.note .link.pane { margin-left: 8px; padding-left: 0; }

.sec { margin-top: 18px; }
.sec > header { display: flex; align-items: baseline; gap: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line-strong); }
.sec h3 { font: 600 17px/1.2 var(--serif); }
.sec > header span { color: var(--ink-2); font-size: 12.5px; }
.sec > header .scale { margin-left: auto; font-size: 12px; white-space: nowrap; }
.sec > header .link { margin-left: auto; }
.sec > header .scale + .link { margin-left: 8px; }
.sec.bad h3 { color: var(--danger); }

.fold { display: grid; grid-template-columns: 28px minmax(0, 1fr); padding-top: 8px; }
.fold.plain { grid-template-columns: minmax(0, 1fr); }
.fold .names { line-height: 1.6; }
.fold .names span { white-space: nowrap; margin-right: 14px; }
.fold .names b { font-weight: 600; }
.fold .names em, .fold .rest { font-style: normal; color: var(--ink-2); }
.fold .after { color: var(--ink-2); font-size: 12px; margin-top: 2px; }

.entry { display: grid; grid-template-columns: 28px minmax(0, 1fr) 246px; padding: 10px 0 11px; border-bottom: 1px solid var(--line); }
.entry.plain { grid-template-columns: minmax(0, 1fr) 246px; }
.entry > .text { padding-right: 24px; }
.chk { padding-top: 3px; }
.entry h4 { font: 600 16px/1.25 var(--serif); }
.count { font: 500 12px/1 var(--sans); margin-left: 6px; display: inline-flex; align-items: center; gap: 2px; }
.count svg { width: 11px; height: 11px; }
.count[aria-expanded="true"] svg { transform: rotate(90deg); }
.story { font: 400 14px/1.45 var(--serif); margin-top: 3px; max-width: 62ch; }
.cost { margin-top: 4px; color: var(--ink-2); font-size: 12.5px; max-width: 70ch; }
.cost .mono { color: var(--ink); }
.entry .err { margin-top: 4px; }
.entry.small { padding: 7px 0 8px; }
.small .chk { padding-top: 2px; }
.entry.small h4 { font: 600 13.5px/1.35 var(--sans); }
.entry.small .story { font: 400 12.5px/1.45 var(--sans); color: var(--ink-2); margin-top: 1px; max-width: 70ch; }

/* a finding's items */
.items { grid-column: 2 / -1; margin-top: 8px; border-top: 1px solid var(--line); }
.plain > .items { grid-column: 1 / -1; }
.item { display: grid; grid-template-columns: 28px minmax(0, 1fr) 246px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.item.plain { grid-template-columns: minmax(0, 1fr) 246px; }
.item:last-child { border-bottom: 0; padding-bottom: 0; }
.item > .text { padding-right: 24px; overflow-wrap: anywhere; }
.item .meta { display: block; color: var(--ink-2); font-size: 12px; }

/* the size column */
.side { display: grid; grid-template-columns: 148px 88px; column-gap: 10px; align-items: center; align-content: start; }
.side b { grid-column: 2; text-align: right; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.side b .unit { font-size: 12.5px; }
.side .when { grid-column: 1 / -1; justify-self: end; text-align: right; color: var(--ink-2); font-size: 12px; margin-top: 1px; }
.side .when.bad { color: var(--danger); }
.side .when svg { color: var(--accent); vertical-align: -2px; margin-right: 5px; }
.side .nosize { grid-column: 1 / -1; justify-self: end; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink-2); }
.small .side b, .item .side b { font-size: 13.5px; }

/* the tray */
.tray { display: flex; align-items: center; gap: 22px; padding: 0 32px; background: var(--panel); border-top: 1px solid var(--line-strong); }
@media (max-width: 996px) { .tray { gap: 12px; } }
.steps { display: flex; align-items: center; gap: 8px; list-style: none; font-size: 12.5px; color: var(--ink-2); }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li i { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-strong); font-style: normal; font-size: 11px; font-weight: 600; }
.steps li.on { color: var(--ink); font-weight: 650; }
.steps li.on i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps li.was i { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.steps li + li::before { content: ""; width: 16px; height: 1px; background: var(--line-strong); margin-right: 2px; }
.tray .say { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; padding: 4px 0; }
.tray .say b { display: block; color: var(--ink); font-weight: 650; }
.pick { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; white-space: nowrap; }
.say b .pick { margin: 0 0 0 12px; font-weight: 400; color: var(--ink-2); vertical-align: bottom; }
.pick svg { color: var(--caution); }
.btn { display: inline-flex; align-items: center; height: 34px; padding: 0 18px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 13.5px; white-space: nowrap; }
.btn.quiet { background: transparent; color: var(--accent); padding: 0 6px; }
.btn.run { background: var(--danger); color: var(--on-danger); }
.btn:disabled { background: var(--track); color: var(--ink-3); }

/* the plan's list, and a run's marks on it */
.act { display: grid; grid-template-columns: 44px minmax(0, 1fr) 246px; padding: 9px 0 10px; border-bottom: 1px solid var(--line); }
.act > .text { padding-right: 24px; }
.act .seq { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; }
.act h4 { font: 600 15px/1.3 var(--serif); }
.ln { display: block; margin-top: 3px; overflow-wrap: anywhere; }
.ln[data-state] { padding-left: 20px; }
.ln svg { float: left; margin: 2px 0 0 -20px; color: var(--ink-3); }
.ln[data-state="done"] svg, .ln[data-state="running"] svg { color: var(--accent); }
.ln[data-state="fail"] svg { color: var(--danger); }
.ln .err { display: block; }
.act .link { margin: 3px 0 0; font-family: var(--sans); }
.ln .link { margin: 0 0 0 8px; }
.act .sub { display: block; margin-top: 3px; color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; }
.act .sub b { color: var(--ink); font-weight: 600; }
.act .sub .mono { color: var(--ink); }
.act .side { padding-top: 1px; }
.act .side b { font-size: 14px; }
.act.skip { grid-template-columns: 44px minmax(0, 1fr); }
.act.skip > svg { color: var(--caution); margin-top: 3px; }
.bad .act > svg { color: var(--danger); }
.act.skip p { margin-top: 3px; color: var(--ink-2); font-size: 12.5px; }
.act.skip .err { color: var(--danger); }
.act.skip p .mono { color: var(--ink); }
/* a row that arrived a moment ago, or the action that is running: after the rows, so its side padding wins */
.fresh { --under: var(--accent-soft); background: var(--accent-soft); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; border-color: transparent; }
.fold .fresh { margin: 0 8px 0 -6px; padding: 2px 6px; border-radius: 3px; }
.undo, .folder { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.undo .mono, .folder .mono { color: var(--ink); margin-left: 6px; }

/* confirm */
.ask { max-width: 560px; margin: 26px auto 0; }
.ask h2 { font: 600 28px/1.15 var(--serif); margin-bottom: 16px; letter-spacing: -.015em; }
.ask dl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; padding: 16px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.ask dt { font-size: 17px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ask dt .unit { font-size: 12.5px; }
.ask dt .sw { margin-right: 8px; vertical-align: 2px; }
.ask dd { font: 400 14.5px/1.45 var(--serif); }
.ask dd b { font-weight: 600; }
.gate { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; }
.gate label { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; }
.gate input { accent-color: var(--danger); }
.fine { margin-top: 12px; color: var(--ink-2); font-size: 12.5px; }

/* the sidebar: the sections, and free space under them */
.nav { grid-row: 1 / -1; grid-column: 1; display: flex; flex-direction: column; padding: 0 10px 14px; background: var(--panel); border-right: 1px solid var(--line-strong); }
.top, .page, .tray { grid-column: 2; }
#pane { grid-row: 2 / -1; }
[data-pane="scan"] #pane, :root:not([data-pane="scan"]) #page, :root:not([data-pane="scan"]) #tray { display: none; }
.nav .name { display: flex; align-items: center; height: 42px; padding: 0 8px; font: 600 17px/1 var(--serif); letter-spacing: -.005em; }
.nav .group { margin: 16px 8px 4px; color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.nav button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); font-size: 13px; text-align: left; }
.nav button svg { color: var(--ink-3); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 650; }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .fig { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nav .fig svg { color: var(--caution); }
.nav .disk { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--ink-2); }
.nav .disk b { color: var(--ink); font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.nav .disk .meter { margin: 7px 0 6px; }

/* a setting: what it is on the left, its state and control on the right */
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 24px; padding: 10px 0 11px; border-bottom: 1px solid var(--line); }
.set h4 { display: flex; align-items: center; gap: 7px; font: 650 13.5px/1.35 var(--sans); }
.set h4 svg { color: var(--caution); }
.set p { margin-top: 2px; color: var(--ink-2); font-size: 12.5px; max-width: 70ch; }
.set p .mono { color: var(--ink); }
.set .then { margin-top: 6px; }
.set .ctl { display: flex; align-items: center; justify-content: flex-end; gap: 12px; white-space: nowrap; }
.set .state { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: 12.5px; }
.set .state svg { color: var(--accent); }
.btn.small { height: 28px; padding: 0 12px; font-size: 12.5px; }
.switch { position: relative; width: 32px; height: 19px; border-radius: 10px; background: var(--line-strong); flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 15px; }

/* Stats: the free-space chart, the runs */
.chart { margin-top: 14px; }
.chart .plot { position: relative; margin-left: 54px; }
.chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .area { fill: var(--track); }
.chart .line { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; }
.chart .dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--b-now); box-shadow: 0 0 0 2px var(--paper); }
.chart .y { position: absolute; left: -54px; width: 46px; text-align: right; transform: translateY(-50%); color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .x { display: flex; justify-content: space-between; margin: 5px 0 0 54px; color: var(--ink-3); font-size: 11px; }
.chart .legend { display: flex; gap: 16px; margin: 6px 0 0 54px; color: var(--ink-2); font-size: 12px; }
.chart .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.chart .legend i.ln { width: 12px; height: 2px; border-radius: 1px; background: var(--ink-2); vertical-align: 3px; }
.chart .cross { position: absolute; top: 0; height: 150px; width: 1px; background: var(--ink-3); }
.chart .tip { position: absolute; top: -30px; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 12px; white-space: nowrap; pointer-events: none; }
.ruled { background: var(--ink-3); }
.bar.split { display: flex; gap: 2px; }
.bar.split i { flex: none; border-radius: 0; box-shadow: none; }
.bar.split i:last-child { border-radius: 0 3px 3px 0; }
.bar.split .staged { background: var(--ink-3); }
.run { display: grid; grid-template-columns: 112px minmax(0, 1fr) 246px; padding: 9px 0 10px; border-bottom: 1px solid var(--line); }
.run > .when { padding-top: 1px; color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.run > .text { padding-right: 24px; }
.run h4 { display: flex; align-items: center; gap: 7px; font: 650 13.5px/1.35 var(--sans); }
.run p { margin-top: 2px; color: var(--ink-2); font-size: 12.5px; }
.run p .mono { color: var(--ink); }
.tag { padding: 0 5px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--ink-2); font: 500 11px/16px var(--sans); }
.tag.bad { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<header class="top" id="top"></header>
<main class="page" id="page"></main>
<footer class="tray" id="tray"></footer>
<main class="page" id="pane"></main>
<script>
'use strict';

// The state. Engine events and clicks change it, render() draws it, and nothing else holds what the page shows.
// The page has no rule about what may be deleted: a tick box exists where the engine sent a `select`, and what
// a plan does is what the engine's plan says.
const S = {
  pane: 'scan',       // scan | general: the section the sidebar shows
  scanTop: 0,         // where the scan section was scrolled to when another section was shown, on which screen:
  scanScreen: '',     // the scroll position holds only for that screen
  settings: null,     // the shell's settings event: login_item, notifications, finder, log, staging
  finder: '',         // allowed | denied | not_asked | unknown: the last word on Control of Finder, the shell's or the confirm step's
  history: null,      // the engine's history event, or {failed: why} when it could not be read
  historyAsk: '',     // the id of the history request on its way
  historyAgain: false, // something changed the history while that request was on its way: ask again on its end
  screen: 'findings', // findings | plan | confirm | running | result; an engine that is down is drawn over it
  hello: null,        // the engine's hello
  tick: null,         // the shell's latest tick: the forecast in the headline
  env: '',            // why the login shell's environment could not be read
  down: '',           // the message of an engine that exited
  cut: null,          // a run the engine exited under: {id, done, of, moves}
  error: null,        // an error event that no other state explains
  opened: false,      // the Full Disk Access settings were opened from here
  wantScan: false,    // the shell asked for a scan before the engine said hello
  reloaded: null,     // the page's process ended and the page was loaded again, losing what it showed: {running}
  scan: null,         // see newScan
  known: false,       // the first plan has said what starts ticked
  ticked: new Set(),  // atoms, each one handed over in a finding's select
  tray: null,         // what the ticked atoms come to: {totals, skipped}; null while the engine counts, false if it could not
  planning: '',       // the id of the plan to review that is on its way: only its answer is drawn
  plan: null,         // the plan under review, see newPlan
  note: '',           // why the plan under review replaced another
  automation: '',     // asking | allowed | denied: whether regrow may control Finder
  read: false,        // the confirm step's tick box
  run: null,          // {req, marks: seq → {state, error, method}, stopping, result, canceled, error, staging}
  safeOpen: false,    // "Safe to clear" shows each finding
  open: new Set(),    // findings and plan groups opened to their lines
  copied: '',         // the text the last copy control handed to the shell
  aerials: null,      // the shell's word on macOS's aerial downloads: {status, pending, queued, error, note}
};

const newScan = () => ({ req: '', id: '', rules: 0, headroom: null, rows: [], totals: null, exclusive: null,
  phase: 'scanning' /* scanning | done | canceled | stale */, why: '', stopping: false });

function newRow(e) {
  const rule = e.finding.rule, select = e.select || null;
  const items = (e.finding.items || []).map((it, i) => {
    const id = rule.id + '/' + it.key;
    if (!home && it.path && String(it.key).startsWith('~/') && it.path.endsWith(it.key.slice(1))) {
      const folder = it.path.slice(0, it.path.length - it.key.length + 1);
      home = new RegExp('(^|[\\s"\'=(:])' + folder.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=/|$)', 'g');
      homeDir = folder;
    }
    return { i, id, atom: select && select.includes(id) ? id : '', name: it.path || it.label || it.key || '',
      path: !!it.path, bytes: it.bytes || 0, lower: !!it.partial, used: it.last_used ? time(it.last_used) : 0 };
  });
  // A select that is the rule's id alone ticks the row as a whole.
  return { n: S.scan.rows.length, id: rule.id, rule, bucket: e.bucket, select, items, error: e.finding.error || '',
    whole: !!select && select.length === 1 && select[0] === rule.id };
}

function newPlan(e) {
  const actions = (e.plan.actions || []).map((a, i) => ({ ...a, seq: i + 1, atom: a.rule_id + (a.item_key ? '/' + a.item_key : '') }));
  const groups = [];
  for (const a of actions) {
    let g = groups[groups.length - 1];
    if (!g || g.rule !== a.rule_id) groups.push(g = { rule: a.rule_id, actions: [], bytes: 0 });
    g.actions.push(a);
    g.bytes += a.bytes || 0;
  }
  return { id: e.plan_id, expires: time(e.expires_at), actions, groups, skipped: e.plan.skipped || [], totals: e.totals,
    commands: actions.filter((a) => a.kind !== 'trash').length, exports: actions.filter((a) => a.kind === 'native' && a.pre_action === 'docker-volume-export').length, sent: false };
}

// ---------- the bridge: requests out, events in ----------

const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.regrow;
const post = (message) => { if (bridge) bridge.postMessage(message); };

// Requests not yet answered, by id, each with the scan it was made for. The shell routes an answer by its id
// alone, so the ids of one load of the page must not be those of another.
const asked = new Map(), load = Date.now().toString(36);
let serial = 0;
function ask(type, role, fields) {
  const id = type[0] + load + '-' + ++serial;
  asked.set(id, { role, scan: S.scan });
  post({ type, id, ...fields });
  return id;
}

const OUT_OF_DATE = { scan_spent: 1, scan_superseded: 1, scan_canceled: 1, unknown_scan: 1 };

window.regrow = { receive(line) {
  try {
    const e = JSON.parse(line), from = asked.get(e.re);
    if (e.event === 'done' || e.event === 'error') asked.delete(e.re);
    // An answer about a scan that is no longer shown changes nothing; an error it has no word for is still shown.
    // The history is about no scan.
    const current = !!from && (from.scan === S.scan || from.role === 'history');
    if (from && !current && (e.event !== 'error' || OUT_OF_DATE[e.code])) return;
    if (on[e.event]) on[e.event](e, current ? from.role : '');
  } catch (err) {
    S.error = { message: 'the page could not read a line from the app: ' + err.message };
  }
  render();
} };

const on = {
  // A first hello starts a scan only when the shell asked for one. Also sent when the engine starts again,
  // always after engine_down: every id from before is dead, and a page that held a scan starts another. Without
  // one between, it is the shell's answer to ready repeating the hello the page has, and starts no scan.
  hello(e) {
    if (S.hello && !S.down) return;
    const again = !!S.down;
    asked.clear(); S.down = ''; S.hello = e; S.historyAsk = '';
    if (S.wantScan || (again && S.scan)) { S.wantScan = false; scan(); }
    askHistory();
  },
  history(e, role) { if (role === 'history') S.history = e; },
  // An autotrim prune is a run of its own.
  tick(e) { S.tick = e; if (e.pruned && e.pruned.run) askHistory(); },
  shell(e) {
    if (e.state === 'settings') { S.settings = e; S.finder = e.finder || ''; }
    if (e.state === 'environment') S.env = e.captured === false ? e.reason || 'no reason given' : '';
    if (e.state === 'automation') S.finder = S.automation = e.allowed ? 'allowed' : 'denied';
    // The menu's Scan, or a relaunch to apply Full Disk Access.
    if (e.state === 'scan') { S.pane = 'scan'; if (S.hello && !S.down) act.scan(); else S.wantScan = true; }
    if (e.state === 'reloaded') S.reloaded = { running: e.running === true };
    if (e.state === 'aerials') S.aerials = { status: e.status || {}, pending: e.pending === true, queued: e.queued === true, error: e.error || '', note: e.note || '' };
    if (e.state !== 'engine_down') return;
    if (S.run && !S.run.result) S.cut = { id: S.plan.id, done: S.plan.actions.filter((a) => stateOf(a).state === 'done').length, of: S.plan.actions.length, moves: S.plan.actions.length > S.plan.commands };
    asked.clear();
    S.historyAsk = '';
    counting = clearTimeout(counting);
    S.down = e.message || 'no reason given';
  },
  headroom(e, role) { if (role === 'scan') S.scan.headroom = e; },
  start(e, role) { if (role === 'scan') { S.scan.id = e.scan_id; S.scan.rules = e.rules; } },
  finding(e, role) { if (role === 'scan') S.scan.rows.push(newRow(e)); },
  summary(e, role) { if (role === 'scan') { S.scan.totals = e.totals; S.scan.exclusive = e.exclusive || {}; } },
  plan(e, role) {
    const figures = { totals: e.totals, skipped: e.plan.skipped || [] };
    if (role === 'first') {
      // The default selection names a rule read in full by its id, also where the row is ticked item by item.
      const starts = e.select || [];
      for (const row of S.scan.rows) for (const atom of row.select || []) if (starts.includes(atom) || starts.includes(row.id)) S.ticked.add(atom);
      S.known = true;
      S.tray = figures;
    } else if (role === 'count') {
      if (e.re === latest) S.tray = figures;
    } else if (role === 'review' && e.re === S.planning) {
      Object.assign(S, { tray: figures, plan: newPlan(e), planning: '', screen: 'plan', read: false, automation: '' });
    }
  },
  journal(e, role) {
    const j = e.entry;
    if (role === 'run') S.run.marks[j.seq] = { state: j.event === 'start' ? 'running' : j.event, error: j.error || '', method: j.receipt ? j.receipt.method : '' };
  },
  done(e, role) {
    if (role === 'scan') {
      S.scan.phase = e.canceled ? 'canceled' : 'done';
      // The aerial row's state is read again, so it is not older than the scan's hold.
      if (!e.canceled) { ask('plan', 'first', { scan_id: S.scan.id }); post({ shell: 'aerials-read' }); }
    } else if (role === 'run') {
      S.run.staging = e.staging_dir || '';
      ended(e.result, e.canceled, '');
    } else if (role === 'history') {
      S.historyAsk = '';
      if (S.historyAgain) askHistory();
    }
  },
  error(e, role) {
    if (OUT_OF_DATE[e.code] && (role === 'first' || role === 'count' || role === 'review')) {
      S.scan.phase = 'stale';
      S.scan.why = e.message || '';
      // A run and its result keep their plan: the scan was spent by that run.
      if (S.screen !== 'running' && S.screen !== 'result') Object.assign(S, { screen: 'findings', planning: '', plan: null });
    } else if (role === 'history') {
      Object.assign(S, { history: { failed: e.message || e.code }, historyAsk: '' });
      if (S.historyAgain) askHistory();
    } else if (role === 'run' && e.result) {
      ended(e.result, false, e.message || e.code);
    } else if (role === 'run') {
      // Nothing ran: back to the plan, with a fresh one. A plan that was too old needs no more words than that.
      Object.assign(S, { screen: 'plan', run: null, error: e.code === 'plan_expired' || e.code === 'unknown_plan' ? null : e });
      review('The plan you confirmed did not run, so this is a fresh one. Nothing has run.');
    } else if (role !== 'review' || e.re === S.planning) {
      // An error for a review the page has dropped is dropped with it.
      if (role === 'scan') S.scan = null;
      if (role === 'review') S.planning = '';
      if (role === 'count') S.tray = false;
      S.error = e;
    }
  },
};

function scan() {
  counting = clearTimeout(counting);
  Object.assign(S, { screen: 'findings', scan: newScan(), reloaded: null, known: false, ticked: new Set(), tray: null, planning: '',
    plan: null, note: '', run: null, error: null, safeOpen: false, open: new Set(), scanScreen: '' });
  S.scan.req = ask('scan', 'scan');
}

// A plan to review is always a fresh one, so the time it can run in starts when it is drawn.
// A count still due is left to go out: a review that fails or is dropped does not fill the tray.
function review(note) {
  S.note = note;
  S.planning = ask('plan', 'review', { scan_id: S.scan.id, select: [...S.ticked] });
}

function ended(result, canceled, error) {
  Object.assign(S.run, { result: result || {}, canceled: !!canceled, error });
  S.screen = 'result';
  askHistory();
}

// Each change of a tick box is one plan request, sent once the clicking pauses; its answer fills the tray.
// `counting` is the timer of a change not yet sent, `latest` the request whose answer counts.
let counting, latest = '';
function toggle(el) {
  if (!canTick()) return;
  const row = S.scan.rows[el.dataset.tick];
  const atoms = el.dataset.tick === 'safe' ? S.scan.rows.filter((r) => r.rule.risk === 'safe' && !r.error).flatMap((r) => r.select || [])
    : el.dataset.item ? [row.items[el.dataset.item].atom] : row.select;
  const all = atoms.every((a) => S.ticked.has(a));
  for (const a of atoms) if (all) S.ticked.delete(a); else if (a) S.ticked.add(a);
  S.tray = null;
  clearTimeout(counting);
  counting = setTimeout(() => {
    counting = 0;
    latest = ask('plan', 'count', { scan_id: S.scan.id, select: [...S.ticked] });
    render();
  }, 200);
}
const canTick = () => !S.down && S.screen === 'findings' && !!S.scan && S.scan.phase === 'done' && S.known && !S.planning;

const expired = (p) => !(Date.now() <= p.expires);
function within(p) {
  const minutes = Math.ceil((p.expires - Date.now()) / 6e4);
  return minutes > 1 ? 'in the next ' + minutes + ' minutes' : 'in the next minute';
}
// Whether the plan's Trash moves know where they will land.
const settled = (p) => p.commands === p.actions.length || S.automation === 'allowed' || S.automation === 'denied';

// What a click does. Each checks the state for itself: a button being enabled is drawing, not permission.
const act = {
  scan() { if (S.hello && !S.down && S.screen !== 'running' && !(S.scan && S.scan.phase === 'scanning')) { S.cut = null; scan(); } },
  stop() {
    const sc = S.scan;
    if (S.down || !sc || sc.phase !== 'scanning' || sc.stopping) return;
    sc.stopping = true;
    ask('cancel', 'cancel', { target: sc.req });
  },
  fold() { S.safeOpen = !S.safeOpen; },
  open(el) { const key = el.dataset.key; if (!S.open.delete(key)) S.open.add(key); },
  review() { if (canTick() && S.ticked.size) review(''); },
  again() { if (!S.down && S.screen === 'plan' && !S.planning) review(''); },
  back() {
    if (S.screen === 'confirm') S.screen = 'plan';
    else if (S.screen === 'plan') Object.assign(S, { screen: 'findings', plan: null, planning: '', note: '' });
  },
  confirm() {
    const p = S.plan;
    if (S.down || S.screen !== 'plan' || S.planning || !p.actions.length || p.sent || expired(p)) return;
    Object.assign(S, { screen: 'confirm', read: false, automation: '' });
    // Asked before the run, so macOS puts its question while no Trash move is waiting on the answer.
    if (!settled(p)) { S.automation = 'asking'; post({ shell: 'automation' }); }
  },
  run() {
    const p = S.plan;
    if (S.down || S.screen !== 'confirm' || !S.read || p.sent || !settled(p)) return;
    if (expired(p)) { S.screen = 'plan'; return; }
    p.sent = true;
    S.cut = null;
    S.run = { req: ask('execute', 'run', { plan_id: p.id }), marks: {}, stopping: false, result: null, canceled: false, error: '', staging: '' };
    S.screen = 'running';
  },
  halt() {
    if (S.down || S.screen !== 'running' || S.run.stopping) return;
    S.run.stopping = true;
    ask('cancel', 'cancel', { target: S.run.req });
  },
  copy(el) { if (el.dataset.text) { S.copied = el.dataset.text; post({ shell: 'copy', text: S.copied }); } },
  fda() { if (S.hello && S.hello.fda !== 'granted') { S.opened = true; post({ shell: 'open-full-disk-access' }); } },
  relaunch() { if (S.opened) post({ shell: 'relaunch' }); },
  section(el) {
    if (S.pane === el.dataset.pane) return;
    if (S.pane === 'scan') Object.assign(S, { scanTop: $('page').scrollTop, scanScreen: root.dataset.screen });
    S.pane = el.dataset.pane;
    $('pane').scrollTop = 0;
    if (S.pane === 'stats') askHistory();
  },
  login() {
    const item = S.settings && S.settings.login_item;
    if (item === 'on' || item === 'off') post({ shell: item === 'on' ? 'login-item-off' : 'login-item-on' });
  },
  loginSettings() { post({ shell: 'login-item-settings' }); },
  automationSettings() { post({ shell: 'automation-settings' }); },
  noticeSettings() { post({ shell: 'notification-settings' }); },
  showLog() { post({ shell: 'show-log' }); },
  showStaging() { post({ shell: 'show-staging' }); },
  aerialsOff() { if (aerialsSwitch() === 'off') { S.aerials.pending = true; post({ shell: 'aerials-off' }); } },
  aerialsOn() { if (aerialsSwitch() === 'on') { S.aerials.pending = true; post({ shell: 'aerials-on' }); } },
  pane(el) { post({ shell: el.dataset.surface === 'screen saver' ? 'open-screen-saver-settings' : 'open-wallpaper-settings' }); },
};

// Which way the aerial downloads' switch goes now, or '' where there is none: off while something is picked, on
// while the last `regrow aerials off` has picks to put back. The shell has the last word on both.
function aerialsSwitch() {
  const a = S.aerials, st = a && a.status, rec = st && st.recorded;
  if (!st || a.pending) return '';
  if (st.state === 'on') return 'off';
  return st.state === 'off' && rec && !rec.restored && (rec.picks || []).length ? 'on' : '';
}
// The picks in words, as `regrow aerials status` writes them.
const picked = (c) => [['categories', 'category'], ['subcategories', 'subcategory'], ['videos', 'video']]
  .filter(([k]) => c && c[k]).map(([k, one]) => c[k] + ' ' + (c[k] === 1 ? one : k)).join(', ') || 'nothing';

// ---------- words and figures ----------

const BUCKET = { // a total's label, and what a row says about when its space comes back
  frees_now: ['frees now, as commands run', 'frees now'],
  after_trash: ['free after you empty the Trash', 'after the Trash is emptied'],
  exported: ['kept as tarballs until you delete them', 'in a tarball until you delete it'],
  shown_only: ['shown only, never deleted', 'shown only'],
  macos_managed: ['macOS reclaims it by itself', 'macOS reclaims it by itself'],
};
const NO_FORECAST = {
  short_history: 'No forecast of when it fills yet: that takes three samples over three hours since free space last jumped up.',
  not_falling: 'No forecast of when it fills: free space is steady or rising.',
};
const FIRST = { // what a pre-action does before its action
  'docker-volume-export': 'a tarball of the volume goes to regrow staging',
  'agent-scratch-recheck': 'the session is checked again',
  'worktree-recheck': 'the worktree is checked again',
};
const STATE = (state) => ({ fail: 'failed', unrun: 'not run' }[state] || state);
// What an unreadable row needs, as far as the engine's hello tells.
const needs = () => (S.hello && S.hello.fda === 'denied' ? 'needs Full Disk Access' : 'could not be read');

const num = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

// engine.HumanBytes. Go rounds a tie to the even digit, where toFixed rounds it up.
function human(n) {
  if (n < 1024) return n + ' B';
  let div = 1024, exp = 0;
  for (let m = Math.floor(n / 1024); m >= 1024; m = Math.floor(m / 1024)) { div *= 1024; exp++; }
  const floor = Math.floor(n * 10 / div), twice = (n * 10 - floor * div) * 2;
  const tenths = twice > div || (twice === div && floor % 2) ? floor + 1 : floor;
  return Math.floor(tenths / 10) + '.' + tenths % 10 + ' ' + 'KMGTPE'[exp] + 'iB';
}

// An RFC 3339 time as milliseconds. The engine writes any number of fraction digits; Date reads three.
const time = (s) => Date.parse(String(s).replace(/\.(\d+)/, (all, f) => '.' + (f + '00').slice(0, 3)));

// Ages are counted from the scan's own sample: they say how things stood when it looked.
function ago(t) {
  const at = S.scan && S.scan.headroom ? time(S.scan.headroom.at) : Date.now();
  const days = Math.floor((at - t) / 864e5);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days < 60 ? days + ' days ago' : Math.round(days / 30) + ' months ago';
}

// The home folder, as a pattern for where a path starts. It is learned from an item whose key is its path
// under ~: the page has no path of its own.
let home = null, homeDir = '';
const tilde = (s) => (home ? String(s).replace(home, '$1~') : String(s));

// One word as a shell reads it back, quoted as the engine's shellQuote quotes it.
const shellWord = (s) => (/[ \t\n'"\\$`*?[\](){}<>|&;!#]/.test(s) ? "'" + s.replace(/'/g, "'\\''") + "'" : s);
// A command as a shell reads it back, for the pasteboard, and as it is drawn: the home folder as ~ only in a
// word left unquoted, where a shell expands it.
const shellLine = (argv) => [].concat(argv || []).map(shellWord).join(' ');
// A shell expands ~ only where it starts a word: after = or : it stays as written.
const tildeWord = (w) => (homeDir && (w === homeDir || w.startsWith(homeDir + '/')) ? '~' + w.slice(homeDir.length) : w);
const drawnWord = (w) => (shellWord(w) === w ? tildeWord(w) : shellWord(w));
const drawnLine = (argv) => [].concat(argv || []).map(drawnWord).join(' ');
// A rule's command before an item fills it in, drawn as drawnLine draws it, a {path} or {arg} word as written.
const ruleLine = (argv) => [].concat(argv || []).map((w) => (/^\{(path|arg)\}$/.test(w) ? w : drawnWord(w))).join(' ');
// How regrow is started in Terminal, as the engine names itself: an app's engine goes by its path.
const cli = () => shellWord((S.hello && S.hello.self) || 'regrow');

const titleOf = (id) => { const row = S.scan.rows.find((r) => r.id === id); return row ? row.rule.title : id; };

// What became of an action: the journal says while the plan runs, and the result says what never started.
function stateOf(a) {
  const run = S.run, mark = run.marks[a.seq];
  if (mark && !(run.result && mark.state === 'running')) return mark;
  if (!run.result) return { state: 'waiting' };
  // A skip is a line "<atom>: <reason>" of the result.
  const skip = (run.result.skipped || []).find((s) => s.startsWith(a.atom + ': '));
  return skip ? { state: 'skipped', error: skip.slice(a.atom.length + 2) } : { state: 'unrun' };
}

// A finding as it is drawn: its own bytes come from the summary once there is one.
function measure(row) {
  const own = S.scan.exclusive || {};
  const items = row.items.map((it) => ({ ...it, own: own[it.id] != null ? own[it.id] : it.bytes, blind: it.lower && !it.bytes }))
    .sort((a, b) => b.own - a.own);
  const sum = (f) => items.reduce((n, it) => n + f(it), 0);
  return { row, items, own: sum((it) => it.own), bytes: sum((it) => it.bytes), lower: items.some((it) => it.lower),

    picked: (row.select || []).filter((a) => S.ticked.has(a)).length };

// ---------- markup ----------

// Markup is built with h`…`. Every value set into it is escaped, unless it is markup that h made.
class Markup { constructor(s) { this.s = s; } }
