const h = (parts, ...values) => new Markup(parts.reduce((out, part, i) => out + show(values[i - 1]) + part));

const svg = (shapes) => new Markup('<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + shapes + '</svg>');
const ICON = {
  lock: svg('<rect x="3.2" y="7" width="9.6" height="6.6" rx="1.6"/><path d="M5.4 7V5.2a2.6 2.6 0 015.2 0V7"/>'),
  caution: svg('<path d="M8 2.2l6 10.6H2z"/><path d="M8 6.4v3M8 11.2v.1"/>'),
  undo: svg('<path d="M5.6 3.4L2.6 6.4l3 3"/><path d="M3 6.4h6.2a3.6 3.6 0 010 7.2H6.4"/>'),
  open: svg('<path d="M6 3.8L10.2 8 6 12.2"/>'),
  done: svg('<path d="M3.2 8.6l3 3 6.4-7"/>'),
  fail: svg('<path d="M4 4l8 8M12 4l-8 8"/>'),
  skipped: svg('<path d="M4 8h8"/>'),
  waiting: svg('<circle cx="8" cy="8" r="4.8"/>'),
  running: svg('<circle cx="8" cy="8" r="3.2" fill="currentColor"/>'),
};

// A size: the figure and its unit set apart.
function size(n, lower) {
  const [figure, unit] = human(n).split(' ');
  return h`<span class="num">${lower ? '≥ ' : ''}${figure}</span><span class="unit"> ${unit}</span>`;
}
// A command or path may wrap at a space or after a slash, never inside a name.
const unbroken = (s) => new Markup(String(s).split(' ').map((word) => word.split('/').map((name) => (name ? '<span class="nb">' + esc(name) + '</span>' : '')).join('/<wbr>')).join(' '));
// A control that hands `text` to the shell for the pasteboard: the text whole, not the form drawn beside it
// (a path drawn with ~ is copied in full).
const copy = (text, what) => h`<button class="link copy" data-do="copy" data-text="${text}" aria-label="Copy the ${what}">${S.copied === text ? 'Copied' : 'Copy'}</button>`;
// A sentence of the engine's or a rule's, with what it quotes in backticks set in mono. A quote that holds a
// space or a slash, a command with its arguments or a path, has its copy control; a bare name has none. A
// command the sentence brings in with a colon is one to run yourself: it gets a line of its own, which ends
// its clause, so the stop written after it is not drawn. A quoted `regrow` command starts regrow as cli() does.
const ownLine = (parts, i) => i % 2 === 1 && i < parts.length - 1 && parts[i].includes(' ') && /:\s*$/.test(parts[i - 1]);
const sentence = (s) => {
  const parts = String(s).split('`');
  return new Markup(parts.map((part, i) => {
    if (i % 2 === 0) return esc(ownLine(parts, i - 1) ? part.replace(/^[.,;]/, '') : part);
    const said = part.replace(/^regrow(?= |$)/, () => cli());
    const quote = '<span class="mono">' + unbroken(said).s + '</span>' + (/[ /]/.test(said) ? copy(said, 'command').s : '');
    return ownLine(parts, i) ? '<span class="cmd">' + quote + '</span>' : quote;
  }).join(''));
};

function bar(bytes, bucket, scale) {
  return h`<span class="bar" aria-hidden="true">${bytes > 0 ? h`<i class="${bucket}" style="width:${Math.min(100, bytes / scale * 100).toFixed(2)}%"></i>` : ''}</span>`;
}

// The disk as it stands, or as it will once `now` bytes are freed and `trash` bytes wait in the Trash. Its
// figures stand under it in words.
function meter(hr, now, trash) {
  const pct = (n) => (Math.max(0, n) / hr.total * 100).toFixed(2) + '%';
  const taken = Math.max(0, hr.total - hr.free - hr.purgeable - now - trash);
  return h`<div class="meter" aria-hidden="true"><i class="taken" style="width:${pct(taken)}"></i>${trash ? h`<i class="after_trash" style="width:${pct(trash)}"></i>` : ''}
<i class="purge" style="width:${pct(hr.purgeable)}"></i>${now ? h`<i class="frees_now" style="width:${pct(now)}"></i>` : ''}<i class="free"></i></div>`;
}

// The size column of a finding or of one of its items.
function side(v, bucket, scale, brief) {
  if (v.blind) {
    return h`<div class="side"><span class="nosize">${ICON.lock}unreadable</span>${brief ? '' : h`<span class="when">${needs()}</span>`}</div>`;
  }
  return h`<div class="side">${bar(v.own, bucket, scale)}<b>${size(v.own, v.lower)}</b>
    ${v.own !== v.bytes ? h`<span class="when">of ${v.lower ? '≥ ' : ''}${human(v.bytes)} in the folder; the rest is in other rows</span>` : ''}
    ${brief ? '' : h`<span class="when">${(BUCKET[bucket] || [])[1]}</span>`}${!brief && v.used ? h`<span class="when">last used ${ago(v.used)}</span>` : ''}</div>`;
}

// A section: its title, a count in words, what stands at the right of its header, and its rows.
const section = (title, count, right, rows, bad) => h`<section class="sec ${bad ? 'bad' : ''}"><header><h3>${title}</h3><span>${count}</span>${right}</header>${rows}</section>`;

function notices(all) {
  const rows = [];
  // The aerial downloads keep filling the disk while anything is picked: said where the findings are, or would be.
  const a = S.aerials, st = a && a.status;
  if ((all || !S.scan) && st && (st.state === 'on' || a.error || a.note || (st.set_for || []).length)) {
    const words = st.state !== 'on' ? '' : h`<span class="line">macOS downloads aerial videos for what is picked for the wallpaper or screen saver (${picked(st.counts)}): at least 4 videos for each category, about 0.5 GB each, and more every day or two, also after a still wallpaper replaced the aerial.</span>`;
    const set = (st.set_for || []).map((s) => {
      const pane = s === 'screen saver' ? 'Screen Saver' : 'Wallpaper';
      return h`<span class="line">An aerial is still set as your ${s}, so macOS may download for it again: choose another in System Settings ▸ ${pane}.<button class="link pane" data-do="pane" data-surface="${s}">Open ${pane} settings</button></span>`;
    });
    const failed = a.error ? h`<span class="err mono">${a.error}</span>` : '';
    const noted = a.note ? h`<span class="line">${a.note}</span>` : '';
    rows.push(h`<div class="note">${ICON.caution}<span>${words}${set}${failed}${noted}</span>${aerialsButton(a)}</div>`);
  }
  if (S.error) {
    rows.push(h`<div class="note">${ICON.caution}<span>regrow's engine answered with an error: <span class="err mono">${S.error.message || S.error.code}</span></span></div>`);
  }
  if (S.cut) {
    // Only what was reported reached the page, and the engine journals an action before it reports it and
    // skips moves it never journals, so the note says nothing it would have to guess from the marks.
    const c = S.cut;
    rows.push(h`<div class="note">${ICON.caution}<span>The engine stopped during the run, after reporting ${c.done} of ${num(c.of, 'action')} done.${c.moves ? h` If it moved anything, <span class="mono">${cli()} undo ${c.id}</span>${copy(cli() + ' undo ' + c.id, 'command')} puts it back; an item it was moving as it stopped may be in the Trash or in regrow staging, and undo does not know of it.` : ''}</span></div>`);
  }
  if (all && S.env) {
    rows.push(h`<div class="note">${ICON.caution}<span>regrow could not read your login shell's environment, so tools outside the system folders are not found: <span class="mono">${S.env}</span></span></div>`);
  }
  if (all && S.hello && S.hello.fda === 'denied') {
    const part = S.scan.rows.filter((r) => r.items.some((it) => it.lower)).length;
    rows.push(h`<div class="note">${ICON.lock}<span>Full Disk Access is off${part ? `, so ${num(part, 'finding')} ${part === 1 ? 'was' : 'were'} read only in part` : ''}. A size marked ≥ is a lower bound.</span>
      <button class="link" data-do="${S.opened ? 'relaunch' : 'fda'}">${S.opened ? 'Relaunch regrow to apply' : 'Open Full Disk Access settings'}</button></div>`);
  }
  return rows;
}

// The aerial downloads' switch, as a link at the end of a line: what it would do, or that macOS is asking, or
// will once the engine has started or ended the scan, run or check in flight.
function aerialsButton(a) {
  if (a.pending) return h`<span class="link wait">${a.queued ? 'Waiting for the engine…' : 'Waiting for your password…'}</span>`;
  const to = aerialsSwitch();
  return to === 'off' ? h`<button class="link" data-do="aerialsOff">Turn off aerial downloads</button>`
    : to === 'on' ? h`<button class="link" data-do="aerialsOn">Turn them back on</button>` : '';
}

// The aerial row says where the downloads stand: its videos come back while anything is picked. A row the scan
// kept keeps its note until the next scan, which offers the videos once nothing is picked.
function aerialsState(kept) {
  const a = S.aerials, st = a && a.status;
  if (!st || (st.state !== 'on' && st.state !== 'off')) return '';
  const said = st.state === 'on' ? `Aerial downloads are on: ${picked(st.counts)} picked.`
    : aerialsSwitch() === 'on' ? 'Aerial downloads are off; regrow keeps what it cleared.' : 'Aerial downloads are off: nothing is picked.';
  // Deleting the videos needs sudo, which the app leaves to Terminal; the clean checks the picks again first.
  const clean = st.state === 'off' ? h`<p class="cost">${sentence('To delete the videos, which asks for your password, run in Terminal: `regrow clean aerial-wallpapers`')}</p>` : '';
  const stale = kept && st.state === 'off' ? h`<p class="cost">The note above is from the last scan; scan again to see the videos offered.</p>` : '';
  return h`<p class="cost aerials">${said}${aerialsButton(a)}</p>${clean}${stale}`;
}

// ---------- the screens ----------

function drawFindings() {
  const sc = S.scan;
  if (!sc) {
    return h`<section class="lead"><h2>${S.hello ? 'No scan to show.' : 'Waiting for regrow.'}</h2>${S.reloaded ? h`<p class="aside">This window's page stopped and was loaded again, so what it showed is gone.${S.reloaded.running ? h` A run was going when it stopped; <span class="mono">${cli()} history</span>${copy(cli() + ' history', 'command')} lists what it did.` : ''}</p>` : ''}</section>${notices(false)}`;
  }
  const scanning = sc.phase === 'scanning', so = scanning ? ' so far' : '';
  const views = sc.rows.map(measure).sort((a, b) => b.own - a.own);
  const failed = views.filter((v) => v.row.error), found = views.filter((v) => !v.row.error && v.items.length);
  const drawn = sc.rows.filter((r) => r.error || r.items.length);
  const fresh = new Set(scanning ? drawn.slice(-2) : []);
  const scale = Math.max(1, ...found.map((v) => v.own));
  // Said once, by the first section that draws a bar.
  let told = false;
  const tell = (list) => {
    if (told || !list.some((v) => !v.blind && v.own > 0)) return '';
    told = true;
    return h`<span class="scale">A full bar is ${human(scale)}, the largest finding${so}</span>`;
  };
  const risk = (r) => found.filter((v) => (r ? v.row.rule.risk === r : v.row.rule.risk !== 'safe' && v.row.rule.risk !== 'caution'));
  const safe = risk('safe'), call = risk('caution'), shown = risk('');
  const draw = (v, small) => entry(v, scale, fresh.has(v.row), small);
  const atoms = safe.flatMap((v) => v.row.select || []), picked = atoms.filter((a) => S.ticked.has(a)).length;
  const ticks = !S.known || !atoms.length ? '' : picked === atoms.length ? ', all ticked' : ', ' + (picked ? safe.filter((v) => v.picked).length : 'none') + ' ticked';

  return h`${lead()}${four()}${notices(true)}
    ${failed.length ? section('Not scanned', `${num(failed.length, 'rule')} ended with an error and ${failed.length === 1 ? 'is' : 'are'} in no total`, '', failed.map((v) => draw(v)), true) : ''}
    ${safe.length ? section('Safe to clear', num(safe.length, 'finding') + so + ticks, h`${S.safeOpen ? tell(safe) : ''}<button class="link" data-do="fold">${S.safeOpen ? 'Fold into one line' : 'Show each one'}</button>`,
      S.safeOpen ? safe.map((v) => draw(v, true)) : fold(safe, atoms, picked, fresh)) : ''}
    ${call.length ? section('Your call', `${num(call.length, 'finding')}${so} that cost${call.length === 1 ? 's' : ''} something to bring back`, tell(call), call.map((v) => draw(v))) : ''}
    ${shown.length ? section('Only shown', `${num(shown.length, 'finding')}${so} regrow never deletes`, tell(shown), shown.map((v) => draw(v))) : ''}`;
}

function lead() {
  const hr = S.scan.headroom, t = S.tick, days = t ? t.days_to_full : null;
  if (!hr) return h`<section class="lead"><h2>Reading this disk.</h2></section>`;
  const forecast = days != null;
  const why = forecast ? '' : !t ? 'No forecast of when it fills yet: regrow has not sampled free space since it started.'
    : t.history_unreadable ? 'No forecast of when it fills: the history of free space could not be read.'
    : NO_FORECAST[t.no_forecast] || 'No forecast of when it fills.';
  return h`<section class="lead"><h2>${forecast ? `At the recent pace, this disk is full in ${days < 1 ? 'under a day' : 'about ' + num(Math.round(days), 'day')}.` : `${human(hr.free)} free of ${human(hr.total)}.`}</h2>
    ${meter(hr, 0, 0)}
    <div class="figures">${forecast ? h`<span><i class="free"></i><b>${human(hr.free)}</b> free of ${human(hr.total)}</span>` : h`<span><i class="taken"></i><b>${human(hr.total - hr.free - hr.purgeable)}</b> taken</span>`}
      <span><i class="purge"></i><b>${human(hr.purgeable)}</b> purgeable, macOS frees it when needed</span><span><b>${human(hr.swap_used)}</b> swap in use</span></div>
    ${why ? h`<p class="aside">${why}</p>` : ''}</section>`;
}

function four() {
  const t = S.scan.totals, stopped = S.scan.phase === 'canceled', names = Object.keys(BUCKET).filter((b) => b !== 'exported' || (t && t.exported > 0));
  const max = t ? Math.max(1, ...names.map((b) => t[b] || 0)) : 1;
  return h`<section class="four" style="grid-template-columns:repeat(${names.length}, minmax(0, 1fr))">${names.map((b) => h`<div class="t" data-bucket="${b}">
      <div class="rule">${t ? h`<i class="${b}" style="width:${((t[b] || 0) / max * 100).toFixed(1)}%"></i>` : ''}</div>
      ${t ? h`<b>${size(t[b] || 0)}</b>` : h`<b class="wait">${stopped ? 'not counted' : 'pending'}</b>`}<span class="name"><i class="sw ${b}"></i>${BUCKET[b][0]}</span></div>`)}</section>
    <p class="apart">${t ? `${names.length === 5 ? 'Five' : 'Four'} totals, never added up: each comes back at a different time, or not at all.` : stopped ? 'The four totals are counted when a scan runs to its end.' : 'The four totals arrive when the scan ends.'}</p>`;
}

// "Safe to clear" as one line: the six largest by name, the rest counted.
function fold(safe, atoms, picked, fresh) {
  const figure = (v) => (v.blind ? 'unreadable' : (v.lower ? '≥ ' : '') + human(v.own));
  const rest = safe.length - 6;
  return h`<div class="fold ${atoms.length ? '' : 'plain'}">${atoms.length ? h`<span class="chk"><input type="checkbox" id="tsafe" data-tick="safe" aria-label="All safe findings" ${picked === atoms.length ? 'checked' : picked ? 'data-some' : ''} ${canTick() ? '' : 'disabled'}></span>` : ''}
    <div><div class="names">${safe.slice(0, 6).map((v) => h`<span class="${fresh.has(v.row) ? 'fresh' : ''}" data-rule="${v.row.id}"><b>${v.row.rule.title}</b> <em>${figure(v)}</em></span> `)}${rest > 0 ? h`<span class="rest" data-more="${rest}">and ${rest} smaller ${rest === 1 ? 'one' : 'ones'}</span>` : ''}</div>
      <div class="after">All of it regrows on its own as you work.</div></div></div>`;
}

// One finding. `small` is the compact row of an opened "Safe to clear".
function entry(v, scale, fresh, small) {
  const row = v.row, rule = row.rule, regen = rule.regen || {};
  if (row.error) {
    return h`<div class="entry plain" data-rule="${row.id}"><div class="text"><h4>${rule.title}</h4><p class="err mono">${row.error}</p></div><div class="side"><span class="when">not scanned</span></div></div>`;
  }
  const open = S.open.has('r' + row.n), each = !!row.select && !row.whole;
  const kept = rule.risk !== 'safe' && rule.risk !== 'caution';
  const runnable = ![].concat(rule.native_command || []).some((w) => /\{(path|arg)\}/.test(w));
  const shown = runnable ? h`<span class="mono">${unbroken(drawnLine(rule.native_command))}</span>${copy(shellLine(rule.native_command), 'command')}`
    : h`<span class="mono">${unbroken(ruleLine(rule.native_command))}</span>`;
  const runs = row.bucket === 'after_trash' ? 'Goes to the Trash; regrow undo restores it.'
    : row.bucket === 'exported' ? h`Runs ${shown} after a tarball goes to regrow staging, no undo.`
    : row.bucket !== 'frees_now' ? '' : rule.native_command ? h`Runs ${shown}, no undo.` : 'A command frees it, with no undo.';
  const count = v.items.length > 1 ? h`<button class="link count" data-do="open" data-key="r${row.n}" id="o${row.n}" aria-expanded="${String(open)}">${ICON.open}${each ? v.picked + ' of ' : ''}${num(v.items.length, v.items[0].path ? 'folder' : 'item')}</button>` : '';
  return h`<div class="entry ${row.select ? '' : 'plain'} ${small ? 'small' : ''} ${fresh ? 'fresh' : ''}" data-rule="${row.id}">
    ${row.select ? h`<span class="chk"><input type="checkbox" id="t${row.n}" data-tick="${row.n}" aria-label="Add ${rule.title} to the plan" ${v.picked === row.select.length ? 'checked' : v.picked ? 'data-some' : ''} ${canTick() ? '' : 'disabled'}></span>` : ''}
    <div class="text"><h4>${rule.title}${count}</h4>
      ${small ? h`<p class="story">${sentence(regen.story || '')}${v.used ? ` Last used ${ago(v.used)}.` : ''}</p>`
        : h`<p class="story">${sentence(regen.story || '')}</p><p class="cost">${kept ? sentence(rule.note || '') : h`Costs: ${regen.cost}. ${runs}`}</p>`}
      ${row.id === 'aerial-wallpapers' ? aerialsState(kept) : ''}</div>
    ${side(v, row.bucket, scale, small)}
    ${open ? h`<div class="items">${v.items.map((it) => item(row, it, each, scale))}</div>` : ''}</div>`;
}

// One item of an opened finding. It has a tick box only where the engine named its atom.
function item(row, it, each, scale) {
  return h`<div class="item ${each ? '' : 'plain'}" data-id="${it.id}">
    ${each ? h`<span class="chk">${it.atom ? h`<input type="checkbox" id="t${row.n}-${it.i}" data-tick="${row.n}" data-item="${it.i}" aria-label="Add ${it.name} to the plan" ${S.ticked.has(it.atom) ? 'checked' : ''} ${canTick() ? '' : 'disabled'}>` : ''}</span>` : ''}
    <div class="text">${it.path ? h`<span class="mono" title="${it.name}">${unbroken(tilde(it.name))}</span>${copy(it.name, 'path')}` : it.name}
      <span class="meta">${it.blind ? needs() : it.used ? 'last used ' + ago(it.used) : 'last use not known'}</span></div>
    ${side(it, row.bucket, scale, true)}</div>`;
}

function drawPlan() {
  const p = S.plan, hr = S.scan.headroom, t = p.totals, vols = p.exports, cmds = p.commands - vols, moves = p.actions.length - p.commands;
  return h`<section class="lead"><h2>${p.actions.length ? `The plan: ${num(p.actions.length, 'action')}, nothing has run yet.` : 'The plan: nothing to run.'}</h2>
      ${S.note ? h`<p class="aside">${S.note}</p>` : ''}
      <p class="say">${cmds ? h`<i class="sw frees_now"></i><b>${human(t.frees_now)}</b> comes back as ${num(cmds, 'command')} ${cmds === 1 ? 'runs; it has' : 'run; they have'} no undo. ` : ''}${moves ? h`<i class="sw after_trash"></i><b>${human(t.after_trash)}</b> goes to the Trash in ${num(moves, 'move')} and is free once you empty it; until then regrow undo restores it. ` : ''}${vols ? h`<i class="sw exported"></i><b>${human(t.exported)}</b> is ${num(vols, 'docker volume')} removed after a tarball of ${vols === 1 ? 'it' : 'each'} goes to regrow staging; the ${vols === 1 ? 'tarball keeps' : 'tarballs keep'} that room until you delete ${vols === 1 ? 'it' : 'them'}, and regrow undo does not restore a volume.` : ''}</p>
      ${hr ? h`${meter(hr, t.frees_now, t.after_trash)}<div class="figures"><span><b>${human(hr.free + t.frees_now)}</b> free once the commands end, up from ${human(hr.free)} now</span></div>` : ''}</section>
    ${notices(false)}
    ${p.skipped.length ? section('Skipped', `${p.skipped.length} ticked ${p.skipped.length === 1 ? 'finding' : 'findings'} the plan cannot run`, '',
      p.skipped.map((s) => h`<div class="act skip">${ICON.caution}<div><h4>${titleOf(s.rule_id)}</h4>${s.item_key ? h`<span class="ln mono">${unbroken(tilde(s.item_key))}${copy(s.item_key, 'path')}</span>` : ''}<p>${sentence(s.reason)}</p></div></div>`)) : ''}
    ${p.actions.length ? section('In the order they run', `${num(p.commands, 'command')} and ${num(moves, 'move')} to the Trash`, tellActions(p), actions('plan')) : ''}`;
}

// An action as it is copied: the path a move takes, or the command. It is read with the home folder as ~.
const moves = (a) => a.kind === 'trash' && !!a.path;
const told = (a) => unbroken(moves(a) ? tilde(a.path) : drawnLine(a.command));
const copyAction = (a) => (moves(a) ? copy(a.path, 'path') : copy(shellLine(a.command), 'command'));
const tellActions = (p) => h`<span class="scale">A full bar is ${human(Math.max(1, ...p.groups.map((g) => g.bytes)))}, the largest action</span>`;

// The plan's actions in the engine's order, grouped by rule. On the plan a group shows its first line and
// opens to the rest; during a run and after it every line is shown, marked with what became of it.
function actions(mode) {
  const p = S.plan, scale = Math.max(1, ...p.groups.map((g) => g.bytes));
  return p.groups.map((g, gi) => {
    const first = g.actions[0], many = g.actions.length > 1, trash = first.kind === 'trash';
    const open = mode !== 'plan' || S.open.has('g' + gi);
    const states = mode === 'plan' ? [] : g.actions.map(stateOf), kinds = [...new Set(states.map((s) => s.state))];
    const tally = kinds.length === 1 ? STATE(kinds[0])
      : ['done', 'fail', 'skipped', 'running'].filter((k) => kinds.includes(k)).map((k) => (k === 'running' ? k : states.filter((s) => s.state === k).length + ' ' + STATE(k))).join(', ');
    const more = many && mode === 'plan' ? h`<button class="link" data-do="open" data-key="g${gi}" id="g${gi}" aria-expanded="${String(open)}">${open ? 'Show only the first' : `and ${g.actions.length - 1} more like it`}</button>` : '';
    const line = (a) => {
      const st = states[a.seq - first.seq];
      return h`<span class="ln mono" ${st ? h`data-state="${st.state}"` : ''}>${st ? ICON[st.state] || ICON.skipped : ''}<span title="${drawnLine(a.command)}">${told(a)}</span>${copyAction(a)}${open ? '' : more}${st && st.error && mode === 'running' ? h`<span class="err">${st.error}</span>` : ''}</span>`;
    };
    return h`<div class="act ${kinds.includes('running') ? 'fresh' : ''}" data-rule="${g.rule}"><span class="seq">${many ? first.seq + '–' + (first.seq + g.actions.length - 1) : first.seq}</span>
      <div class="text"><h4>${titleOf(g.rule)}</h4>${(open ? g.actions : [first]).map(line)}${open ? more : ''}
        ${first.pre_action ? h`<span class="sub">First, ${FIRST[first.pre_action] || h`the check <span class="mono">${first.pre_action}</span> runs`}.</span>` : ''}
        ${g.actions.flatMap((a) => a.includes || []).map((x) => h`<span class="sub"><b>Also removes</b> <span class="mono">${unbroken(tilde(x.id))}</span> (${human(x.bytes)})</span>`)}
        ${[...new Set(states.filter((s) => s.state === 'skipped').map((s) => s.error))].map((why) => h`<span class="sub"><b>Skipped:</b> ${sentence(why)}</span>`)}</div>
      <div class="side">${bar(g.bytes, trash ? 'after_trash' : first.pre_action === 'docker-volume-export' ? 'exported' : 'frees_now', scale)}<b>${size(g.bytes)}</b>
        ${mode !== 'plan' ? h`<span class="when ${kinds.includes('fail') ? 'bad' : ''}">${tally}</span>` : trash ? h`<span class="when">${ICON.undo}undo restores</span>` : h`<span class="when">no undo</span>`}</div></div>`;
  });
}

function drawConfirm() {
  const p = S.plan, t = p.totals, vols = p.exports, cmds = p.commands - vols, moves = p.actions.length - p.commands, run = `Run ${num(p.actions.length, 'action')}`;
  const names = [...new Set(p.skipped.map((s) => titleOf(s.rule_id)))];
  const trash = S.automation === 'asking' ? h`<b>${num(moves, 'move')} to the Trash.</b> Asking macOS whether regrow may control Finder, which makes the moves; the button stays locked until it answers.`
    : S.automation === 'denied' ? h`<b>${num(moves, 'move')} to regrow staging.</b> regrow may not control Finder, so the moves land in regrow staging: regrow undo restores them, and emptying the Trash does not free them.`
    : h`<b>${num(moves, 'move')} to the Trash.</b> Free once you empty it; until then regrow undo puts them back.`;
  return h`<section class="ask"><h2>${run}?</h2><dl>
      ${cmds ? h`<dt><i class="sw frees_now"></i>${size(t.frees_now)}</dt><dd><b>${num(cmds, 'command')} with no undo.</b> The space is free as ${cmds === 1 ? 'it runs, and what it deletes' : 'they run, and what they delete'} comes back only by regrowing.${p.actions.some((a) => a.empties_trash) ? `${cmds === 1 ? ' It' : ' One of them'} empties the Trash: what is in it now is gone for good.` : ''}</dd>` : ''}
      ${moves ? h`<dt><i class="sw after_trash"></i>${size(t.after_trash)}</dt><dd>${trash}</dd>` : ''}
      ${vols ? h`<dt><i class="sw exported"></i>${size(t.exported)}</dt><dd><b>${num(vols, 'docker volume')} removed, with no undo.</b> ${vols === 1 ? 'It is' : 'Each is'} exported to a tarball in regrow staging first, which keeps that room until you delete it; regrow undo does not restore a volume.</dd>` : ''}
      ${names.length ? h`<dt><i class="sw"></i>${p.skipped.length} skipped</dt><dd>Left as ${names.length === 1 ? 'it is' : 'they are'}: ${names.join(', ')}. The plan says why.</dd>` : ''}</dl>
    <div class="gate"><label><input type="checkbox" id="read" ${S.read ? 'checked' : ''}><span>${p.commands ? `I read the ${num(p.commands, 'command')}. ${p.commands === 1 ? 'It has' : 'They have'} no undo.` : 'I read the plan. Every action in it is a move that regrow undo puts back.'}</span></label>
      <button class="btn run" id="go" data-do="run" ${S.read && settled(p) ? '' : 'disabled'}>${run}</button></div>
    <p class="fine">Return does nothing here. The plan can run once, ${within(p)}.</p></section>`;
}

function drawRunning() {
  const p = S.plan, states = p.actions.map(stateOf), failed = states.filter((s) => s.state === 'fail').length;
  return h`<section class="lead"><h2>${S.run.stopping ? 'Stopping after this action' : 'Running the plan'}: ${states.filter((s) => s.state === 'done').length} of ${num(p.actions.length, 'action')} done${failed ? `, ${failed} failed` : ''}.</h2></section>
    ${notices(false)}${section('In the order they run', 'each line is marked as it starts and as it ends', tellActions(p), actions('running'))}`;
}

function drawResult() {
  const p = S.plan, run = S.run, r = run.result, states = p.actions.map((a) => [a, stateOf(a)]);
  const failed = states.filter(([, s]) => s.state === 'fail'), skipped = states.filter(([, s]) => s.state === 'skipped').length;
  const trash = r.trash_bytes || 0, staged = r.staged_bytes || 0, exported = r.exported_bytes || 0, freed = Math.max(0, (r.bytes || 0) - trash - staged - exported);
  const moved = trash || staged || states.some(([, s]) => s.method === 'finder' || s.method === 'staging');
  const id = r.run_id || p.id, undo = cli() + ' undo ' + id;
  // The run's folder in regrow staging, as the engine names it, where something of the run is.
  const folder = run.staging && (staged || exported) ? h`<p class="folder">The run's folder in regrow staging:<span class="mono">${unbroken(tilde(run.staging))}</span>${copy(run.staging, 'folder')}</p>` : '';
  return h`<section class="lead"><h2>${run.canceled ? 'Stopped' : 'The run has ended'}: ${r.done || 0} of ${num(p.actions.length, 'action')} done${r.failed ? `, ${r.failed} failed` : ''}${skipped ? `, ${skipped} skipped` : ''}.</h2>
      ${run.error ? h`<p class="err mono">${run.error}</p>` : ''}
      <p class="say">${freed ? h`<i class="sw frees_now"></i><b>${human(freed)}</b> is free now. ` : ''}${trash ? h`<i class="sw after_trash"></i><b>${human(trash)}</b> is in the Trash, and is free once you empty it. ` : ''}${staged ? h`<b>${human(staged)}</b> is in regrow staging, because Finder could not take it: emptying the Trash does not free that. ` : ''}${exported ? h`<b>${human(exported)}</b> of removed Docker volumes is kept as tarballs (docker-volume-*.tar) ${run.staging ? "in the run's folder of regrow staging" : h`in the folder <span class="mono">${id}</span>${copy(id, 'run id')} of regrow staging`}. Delete those files to free that room; regrow undo does not restore them: they are the recovery copy. Docker hands the space it held for them back to the Mac only when it trims its disk image.` : ''}${freed || trash || staged || exported ? '' : 'No space was freed.'}</p>
      ${moved ? h`<p class="undo">To put back what went to the Trash${staged ? ' and to staging' : ''}:<span class="mono">${undo}</span>${copy(undo, 'command')}</p>` : ''}${folder}</section>
    ${notices(false)}
    ${failed.length ? section('Failed', `${num(failed.length, 'action')} ended with an error`, '',
      failed.map(([a, s]) => h`<div class="act skip">${ICON.fail}<div><h4>${titleOf(a.rule_id)}</h4><span class="ln mono">${told(a)}${copyAction(a)}</span><p class="err mono">${s.error}</p></div></div>`), true) : ''}
    ${section('In the order they ran', 'what became of each action', tellActions(p), actions('result'))}`;
}

function drawDown() {
  return h`<section class="lead"><h2>regrow's engine has stopped.</h2><p class="err mono">${S.down}</p>
    <p class="aside">${S.scan ? 'This page scans again as soon as the engine is back.' : S.wantScan ? 'The scan you asked for starts as soon as the engine is back.' : 'Scan once the engine is back.'}</p></section>${notices(false)}`;
}

const progress = (part, stop, stopping, label) => h`<span class="progress"><i style="width:${(part * 100).toFixed(1)}%"></i></span><button class="link" data-do="${stop}" ${stopping ? 'disabled' : ''}>${stopping ? 'Stopping' : label}</button>`;

function drawTop() {
  const sc = S.scan;
  let status = '', right = '';
  if (S.down) {
    status = 'the engine has stopped';
  } else if (S.screen === 'running') {
    const ended = S.plan.actions.filter((a) => ['done', 'fail'].includes(stateOf(a).state)).length;
    status = `${ended} of ${num(S.plan.actions.length, 'action')} have ended`;
    right = progress(ended / S.plan.actions.length, 'halt', S.run.stopping, 'Stop after this action');
  } else if (S.screen === 'findings' && sc && sc.phase === 'scanning') {
    status = sc.rules ? `${sc.rows.length} of ${num(sc.rules, 'rule')} have reported` : 'starting the scan';
    right = progress(sc.rules ? sc.rows.length / sc.rules : 0, 'stop', sc.stopping, 'Stop');
  } else if (S.screen === 'findings') {
    const failed = sc ? sc.rows.filter((r) => r.error).length : 0;
    status = !sc ? '' : sc.phase === 'canceled' ? `stopped after ${sc.rows.length} of ${num(sc.rules, 'rule')}`
      : `${num(sc.rules, 'rule')} scanned` + (failed ? `, ${failed} ended with an error` : '') + (sc.phase === 'stale' ? ', now out of date' : '');
    right = S.hello && sc ? h`<button class="link" data-do="scan">Scan again</button>` : '';
  }
  if (S.pane !== 'scan') return h`<h1>${PANES[S.pane]}</h1>`;
  return h`<h1>Scan</h1><span class="status">${status}</span><span class="grow"></span>${right}`;
}

function drawTray() {
  const sc = S.scan, p = S.plan, step = { findings: 0, plan: 1, confirm: 2 }[S.screen];
  const again = h`<button class="btn" data-do="scan">Scan again</button>`;
  let say = '', buttons = '';
  if (S.down) {
    say = 'Waiting for the engine to come back.';
  } else if (S.screen === 'plan') {
    const old = expired(p) || p.sent;
    say = S.planning ? 'Making a fresh plan.' : old ? 'This plan is too old to run. Nothing has run.' : !p.actions.length ? 'Nothing in this plan can run.' : `Nothing has run yet. The plan can run once, ${within(p)}.`;
    buttons = h`<button class="btn quiet" data-do="back">Back</button>${old || S.planning ? h`<button class="btn" data-do="again" ${S.planning ? 'disabled' : ''}>Plan again</button>` : h`<button class="btn" data-do="confirm" id="next" ${p.actions.length ? '' : 'disabled'}>Run plan…</button>`}`;
  } else if (S.screen === 'confirm') {
    say = 'Nothing runs until you tick the box.';
    buttons = h`<button class="btn quiet" data-do="back">Back to the plan</button>`;
  } else if (S.screen === 'running') {
    say = S.run.stopping ? 'Stopping once the action that is running ends.' : 'The plan is running. An action that has started runs to its end.';
  } else if (S.screen === 'result') {
    say = 'This scan is spent. Scan again to see the disk as it is now.';
    buttons = again;
  } else if (!sc) {
    say = S.hello ? 'A scan reads the disk and removes nothing.' : S.wantScan ? 'The scan starts once the engine is ready.' : 'Waiting for the engine to start.';
    buttons = h`<button class="btn" data-do="scan" ${S.hello ? '' : 'disabled'}>Scan</button>`;
  } else if (sc.phase === 'scanning' || !S.known && sc.phase === 'done') {
    say = sc && sc.phase === 'done' ? 'Working out what starts ticked.' : 'Findings arrive as each rule reports. The plan opens when the scan ends.';
    buttons = h`<button class="btn" disabled>Review plan</button>`;
  } else if (sc.phase !== 'done') {
    say = sc.phase === 'stale' ? h`<b>This scan is out of date.</b>${sc.why}` : 'The scan was stopped before its end, so there is no plan.';
    buttons = again;
  } else {
    const t = S.tray;
    say = h`<b>${num(sc.rows.filter((r) => (r.select || []).some((a) => S.ticked.has(a))).length, 'finding')} ticked${t && t.skipped.length ? h`<span class="pick">${ICON.caution}${t.skipped.length} skipped</span>` : ''}</b>${!t ? (t === null ? 'counting what that frees' : '') : h`
      <span class="pick"><i class="sw frees_now"></i>${human(t.totals.frees_now)} frees now</span><span class="pick"><i class="sw after_trash"></i>${human(t.totals.after_trash)} after the Trash is emptied</span>${t.totals.exported ? h`<span class="pick"><i class="sw exported"></i>${human(t.totals.exported)} in volume exports</span>` : ''}`}`;
    buttons = h`<button class="btn" data-do="review" id="next" ${S.planning || !S.ticked.size ? 'disabled' : ''}>${S.planning ? 'Planning' : 'Review plan'}</button>`;
  }
  return h`<ol class="steps">${['Findings', 'Plan', 'Confirm'].map((name, i) => h`<li class="${i === step ? 'on' : step == null || i < step ? 'was' : ''}"><i>${i + 1}</i>${name}</li>`)}</ol>
    <span class="say">${say}</span><span class="grow"></span>${buttons}`;
}

// ---------- General: the app, its grants, what it is ----------

// A switch stands for a setting the shell holds: a click asks the shell to change it, and the switch moves
// once the shell says it did.
const switchOf = (on, act, label) => h`<button class="switch" role="switch" aria-checked="${String(on)}" aria-label="${label}" data-do="${act}"></button>`;
const setting = (key, title, text, control, more) => h`<div class="set" data-setting="${key}"><div class="text"><h4>${title}</h4>${text ? h`<p>${text}</p>` : ''}${more || ''}</div><div class="ctl">${control}</div></div>`;
const state = (word, ok) => h`<span class="state ${ok ? 'ok' : ''}">${ok ? ICON.done : ''}${word}</span>`;

function startup() {
  const item = S.settings && S.settings.login_item;
  const text = 'Regrow opens in the menu bar when you log in, with no window.';
  if (!S.settings) return setting('login', 'Start with Mac', text, state('…'));
  if (!item) return setting('login', 'Start with Mac', 'Only the copy in ~/Applications can start with your Mac.', '');
  if (item === 'needs_approval') {
    return setting('login', 'Start with Mac', text + ' macOS holds it until you allow it in Login Items.', h`${state('needs approval')}<button class="link" data-do="loginSettings">Open Login Items settings</button>`);
  }
  return setting('login', 'Start with Mac', text, h`${state(item)}${switchOf(item === 'on', 'login', 'Start with Mac')}`);
}

// How many of the three grants are off: Full Disk Access, Control of Finder, Notifications. One macOS did not
// say is not counted.
function grantsOff() {
  return [S.hello && S.hello.fda === 'denied', S.finder === 'denied', !!S.settings && S.settings.notifications === 'denied'].filter(Boolean).length;
}

function permissions() {
  const fda = S.hello ? S.hello.fda : '', st = S.settings || {}, finder = S.finder;
  const part = S.scan ? S.scan.rows.filter((r) => r.items.some((it) => it.lower)).length : 0;
  const rows = [];
  if (fda === 'granted') rows.push(setting('fda', 'Full Disk Access', 'regrow reads every folder it looks in.', state('on', true)));
  else if (fda) {
    rows.push(setting('fda', h`${ICON.lock}Full Disk Access`, `${fda === 'denied' ? 'Off' : 'Not known'}${part ? `: ${num(part, 'finding')} of the last scan ${part === 1 ? 'was' : 'were'} read only in part` : ''}. Folders macOS protects, such as Mail, Safari and other apps' containers, read as unreadable or as a lower bound.`,
      h`${state(fda === 'denied' ? 'off' : 'unknown')}<button class="btn small" data-do="${S.opened ? 'relaunch' : 'fda'}">${S.opened ? 'Relaunch to apply' : 'Open settings'}</button>`,
      h`<p class="then">${S.opened ? 'Turn Regrow on in the list, then relaunch: macOS applies the grant when the app starts again.' : 'Opens Privacy & Security ▸ Full Disk Access in System Settings. The grant applies once regrow relaunches.'}</p>`));
  }
  const FINDER = {
    allowed: ['on', 'A Trash move goes through Finder, so Put Back works and emptying the Trash frees it.'],
    denied: ['off', 'Trash moves land in regrow staging, which emptying the Trash does not free; regrow undo puts them back.'],
    not_asked: ['not asked yet', 'macOS asks at the first confirm that holds a Trash move. Through Finder, Put Back works and emptying the Trash frees the space.'],
    unknown: ['unknown', 'macOS did not say, as when Finder is not running. regrow reads it again when this window comes to the front.'],
  };
  const [word, text] = FINDER[finder] || ['…', ''];
  rows.push(setting('finder', 'Control of Finder', text, h`${state(word, finder === 'allowed')}${finder === 'denied' ? h`<button class="link" data-do="automationSettings">Open settings</button>` : ''}`));
  const NOTICES = { allowed: 'on', denied: 'off', not_asked: 'not asked yet', unknown: 'not available in this copy' };
  rows.push(setting('notifications', 'Notifications', 'An alert when free space crosses a line or falls fast.',
    h`${state(NOTICES[st.notifications] || '…', st.notifications === 'allowed')}${st.notifications === 'allowed' || st.notifications === 'denied' ? h`<button class="link" data-do="noticeSettings">Open settings</button>` : ''}`));
  const off = grantsOff();
  return section('Permissions', off ? `${off} of 3 off` : '', '', rows);
}

function about() {
  const st = S.settings || {}, staged = S.tick && S.tick.staged_bytes;
  return section('About', '', '', [
    setting('version', 'Version', '', state(S.hello ? 'regrow ' + S.hello.version : '…')),
    S.hello && S.hello.self ? setting('engine', 'Engine', h`<span class="mono">${unbroken(tilde(S.hello.self))}</span>${copy(S.hello.self, 'path')}`, '') : '',
    st.log ? setting('log', 'Logs', h`<span class="mono">${unbroken(tilde(st.log))}</span>, with the engine's <span class="mono">engine.log</span> beside it`, h`<button class="link" data-do="showLog">Show in Finder</button>`) : '',
    st.staging ? setting('staging', 'Regrow staging', 'What a run moved there when Finder was not available, and the exports made before a docker volume is removed. Emptying the Trash does not free it.',
      staged ? h`${state(human(staged))}<button class="link" data-do="showStaging">Show in Finder</button>` : state(S.tick ? 'empty' : '…')) : '',
  ]);
}

const drawGeneral = () => h`${section('Startup', '', '', startup())}${permissions()}${about()}`;

// ---------- Stats: what regrow has done on this Mac ----------

const askHistory = () => {
  if (S.historyAsk) S.historyAgain = true;
  else if (S.hello && !S.down) Object.assign(S, { historyAsk: ask('history', 'history'), historyAgain: false });
};
const sumOf = (runs, key) => runs.reduce((n, r) => n + (r[key] || 0), 0);
const sizeOfRun = (r) => (r.frees_now || 0) + (r.after_trash || 0) + (r.staged || 0) + (r.exported || 0);
const ruleTitle = (id) => (S.history.titles || {})[id] || id;
const year = (t) => (new Date(t).getFullYear() === new Date().getFullYear() ? {} : { year: 'numeric' });
const day = (t) => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', ...year(t) });
const stamp = (t) => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', ...year(t), hour: '2-digit', minute: '2-digit' });
const GIB = 1024 ** 3;

// A run's bytes on a bar of its own: a segment per total, in its colour, on the list's shared scale.
function split(r, scale) {
  const parts = [['frees_now', r.frees_now], ['after_trash', r.after_trash], ['staged', r.staged], ['exported', r.exported]].filter(([, n]) => n > 0);
  return h`<span class="bar split" aria-hidden="true">${parts.map(([k, n]) => h`<i class="${k}" style="width:${Math.min(100, n / scale * 100).toFixed(2)}%"></i>`)}</span>`;
}

// Free space over the samples, one line on its own scale from zero, each run since the first sample that cleaned
// something a dot on it, a run after the last sample at the right edge.
function chart(samples, runs) {
  const sm = samples.map((s) => [time(s.at), s.free]), t0 = sm[0][0], t1 = sm[sm.length - 1][0];
  const top = Math.max(...sm.map((s) => s[1])), quarter = Math.max(1, top / GIB / 4), unit = 10 ** Math.floor(Math.log10(quarter));
  const step = [1, 2, 5, 10].find((m) => m * unit >= quarter) * unit * GIB;
  const y1 = Math.max(step, Math.ceil(top / step) * step), X = (t) => (t - t0) / (t1 - t0) * 1000, Y = (b) => 150 - b / y1 * 150;
  const line = sm.map((s, i) => (i ? 'L' : 'M') + X(s[0]).toFixed(1) + ' ' + Y(s[1]).toFixed(1)).join('');
  const ticks = [];
  for (let v = 0; v <= y1; v += step) ticks.push(v);
  const dots = runs.filter((r) => sizeOfRun(r) > 0 && time(r.start) >= t0).map((r) => {
    const at = Math.min(time(r.start), t1), near = sm.reduce((a, b) => (Math.abs(b[0] - at) < Math.abs(a[0] - at) ? b : a));
    return h`<span class="dot" style="left:${(X(at) / 10).toFixed(2)}%;top:${(Y(near[1]) / 1.5).toFixed(2)}%" title="${stamp(time(r.start))}: ${human(sizeOfRun(r))} cleaned"></span>`;
  });
  const days = [0, 1, 2, 3, 4].map((i) => t0 + (t1 - t0) * i / 4);
  return h`<div class="chart"><div class="plot" data-t0="${t0}" data-t1="${t1}">
      <svg viewBox="0 0 1000 150" preserveAspectRatio="none" aria-label="Free space over time">${new Markup(
        ticks.map((v) => `<line class="grid" x1="0" x2="1000" y1="${Y(v)}" y2="${Y(v)}" vector-effect="non-scaling-stroke"/>`).join('')
        + `<path class="area" d="${line}L${X(t1).toFixed(1)} 150L0 150Z"/><path class="line" d="${line}" vector-effect="non-scaling-stroke"/>`)}</svg>
      ${dots}${ticks.map((v) => h`<span class="y" style="top:${(Y(v) / 1.5).toFixed(2)}%">${Math.round(v / GIB)} GiB</span>`)}
      <span class="cross" hidden></span><span class="tip" hidden></span></div>
    <div class="x">${days.map((d) => h`<span>${t1 - t0 < 4 * 864e5 ? stamp(d) : day(d)}</span>`)}</div>
    <div class="legend"><span><i class="ln"></i>free space</span>${dots.length ? h`<span><i class="frees_now"></i>a run that cleaned something</span>` : ''}</div></div>`;
}

function drawStats() {
  const hi = S.history;
  if (!hi && S.down) return h`<section class="lead"><h2>regrow's engine has stopped.</h2><p class="err mono">${S.down}</p><p class="aside">What regrow has done shows here once the engine is back.</p></section>`;
  if (!hi) return h`<section class="lead"><h2>Reading what regrow has done.</h2></section>`;
  if (hi.failed) {
    return h`<section class="lead"><h2>regrow's history could not be read.</h2><p class="err mono">${hi.failed}</p>
      <p class="aside"><span class="mono">${cli()} history</span> in Terminal reads the same journal.</p></section>`;
  }
  const runs = hi.runs, samples = hi.samples || [];
  const freed = sumOf(runs, 'frees_now'), trash = sumOf(runs, 'after_trash'), staged = sumOf(runs, 'staged'), exported = sumOf(runs, 'exported');
  const failed = runs.filter((r) => r.failed).length, prunes = runs.filter((r) => r.prune);
  const lead = runs.length
    ? h`<section class="lead"><h2>regrow has freed ${human(freed)} on this Mac since ${day(time(runs[0].start))}.</h2>
      <p class="say">In ${num(runs.length, 'run')}${failed ? `, ${failed} with an action that failed` : ''}.${prunes.length ? ` ${num(prunes.length, 'prune')} of the Go build cache freed ${human(sumOf(prunes, 'frees_now'))} of it.` : ''}</p></section>`
    : h`<section class="lead"><h2>Nothing has run on this Mac yet.</h2><p class="say">What a run frees shows here once one has run, from this window or from <span class="mono">${cli()} clean</span> in Terminal.</p></section>`;
  const totals = [['frees_now', freed, 'freed as commands ran'], ['after_trash', trash, 'moved to the Trash, free once it is emptied'], ['exported', exported, 'kept as docker volume tarballs']].filter(([k, n]) => k === 'frees_now' || n > 0);
  const most = Math.max(1, ...totals.map(([, n]) => n));
  const four = runs.length ? h`<section class="four" style="grid-template-columns:repeat(${totals.length}, minmax(0, 1fr))">${totals.map(([k, n, name]) => h`<div class="t" data-bucket="${k}">
      <div class="rule"><i class="${k}" style="width:${(n / most * 100).toFixed(1)}%"></i></div><b>${size(n)}</b><span class="name"><i class="sw ${k}"></i>${name}</span></div>`)}</section>
    <p class="apart">${totals.length > 1 ? 'Never added up: each came back at a different time, or not at all. ' : ''}${staged ? `${human(staged)} more went to regrow staging, which emptying the Trash does not free.` : ''}</p>` : '';
  const span = samples.length > 1 ? Math.round((time(samples[samples.length - 1].at) - time(samples[0].at)) / 864e5) : 0;
  const free = hi.samples_unreadable ? h`<p class="aside">The history of free space could not be read.</p>`
    : samples.length < 2 || time(samples[samples.length - 1].at) <= time(samples[0].at) ? h`<p class="aside">Not enough samples yet: the watch takes one every 15 minutes.</p>` : chart(samples, runs);
  const rules = Object.entries(runs.reduce((all, r) => { for (const [id, n] of Object.entries(r.rules || {})) all[id] = (all[id] || 0) + n; return all; }, {})).sort((a, b) => b[1] - a[1]);
  const top = rules.slice(0, 8), scale = top.length ? top[0][1] : 1, runScale = Math.max(1, ...runs.map(sizeOfRun));
  return h`${lead}${four}
    ${section('Free space', span ? 'the last ' + num(span, 'day') : '', '', free)}
    ${top.length ? section('By rule', top.length < rules.length ? `the ${top.length} largest of ${rules.length}` : num(rules.length, 'rule'), h`<span class="scale">A full bar is ${human(scale)}</span>`,
      top.map(([id, n]) => h`<div class="entry plain small" data-rule="${id}"><div class="text"><h4>${ruleTitle(id)}</h4></div><div class="side">${bar(n, 'ruled', scale)}<b>${size(n)}</b></div></div>`)) : ''}
    ${runs.length ? section('Runs', num(runs.length, 'run') + ', the latest first', '', runs.slice().reverse().map((r) => h`<div class="run" data-run="${r.id}"><span class="when">${stamp(time(r.start))}</span>
      <div class="text"><h4>${r.prune ? 'Go build cache prune' : num(r.done + r.failed, 'action')}${r.failed ? h`<span class="tag bad">${r.failed} failed</span>` : ''}${r.undone ? h`<span class="tag">${r.undone} put back</span>` : ''}</h4>
        ${r.restorable ? h`<p>${num(r.restorable, 'move')} can still be put back: <span class="mono">${cli()} undo ${r.id}</span>${copy(cli() + ' undo ' + r.id, 'command')}</p>` : ''}</div>
      <div class="side">${split(r, runScale)}<b>${size(sizeOfRun(r))}</b></div></div>`)) : ''}`;
}

// The chart's crosshair follows the pointer, drawn straight into the plot: what it shows is no state of the page.
document.addEventListener('mousemove', (e) => {
  const plot = document.querySelector('#pane .plot');
  if (!plot || !S.history || !S.history.samples) return;
  const tip = plot.querySelector('.tip'), cross = plot.querySelector('.cross'), box = plot.getBoundingClientRect();
  if (e.clientX < box.left || e.clientX > box.right || e.clientY < box.top || e.clientY > box.bottom) { tip.hidden = cross.hidden = true; return; }
  const f = (e.clientX - box.left) / box.width, at = +plot.dataset.t0 + f * (+plot.dataset.t1 - +plot.dataset.t0);
  const s = S.history.samples.reduce((a, b) => (Math.abs(time(b.at) - at) < Math.abs(time(a.at) - at) ? b : a));
  tip.textContent = stamp(time(s.at)) + ' · ' + human(s.free) + ' free';
  tip.hidden = cross.hidden = false;
  cross.style.left = f * 100 + '%';
  tip.style.left = Math.min(f * box.width + 8, box.width - tip.offsetWidth) + 'px';
});

// ---------- the sidebar ----------

const PANES = { scan: 'Scan', stats: 'Stats', general: 'General' };
const PANE_ICON = {
  stats: svg('<path d="M2.5 13.5h11"/><path d="M4.5 11V8M8 11V4.5M11.5 11V6.5"/>'),
  scan: svg('<rect x="2" y="4.5" width="12" height="7" rx="1.6"/><path d="M4.6 9h.1M7.2 9h4.2"/>'),
  general: svg('<circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/>'),
};

// What a section's line in the sidebar says beside its name: the scan while it is busy, the grants that are off.
function figure(pane) {
  if (pane === 'scan') return S.down ? 'stopped' : S.screen === 'running' ? 'running' : S.scan && S.scan.phase === 'scanning' ? 'scanning' : '';
  if (pane === 'stats') return S.history && S.history.runs && S.history.runs.length ? human(sumOf(S.history.runs, 'frees_now')) : '';
  const off = grantsOff();
  return off ? h`${ICON.caution}${off}` : '';
}

const paneButton = (pane) => h`<button id="nav-${pane}" data-do="section" data-pane="${pane}" aria-current="${S.pane === pane ? 'page' : 'false'}">${PANE_ICON[pane]}${PANES[pane]}<span class="fig">${figure(pane)}</span></button>`;

function drawNav() {
  const t = S.tick;
  const disk = t ? h`<div class="disk"><b>${human(t.free)}</b> free<br>of ${human(t.total)}${meter(t, 0, 0)}${t.days_to_full != null ? `Full in ${t.days_to_full < 1 ? 'under a day' : 'about ' + num(Math.round(t.days_to_full), 'day')} at the recent pace` : ''}</div>` : '';
  return h`<div class="name">regrow</div>${paneButton('scan')}${paneButton('stats')}<div class="group">Settings</div>${paneButton('general')}${disk}`;
}

// ---------- drawing and wiring ----------

const SECTIONS = { stats: drawStats, general: drawGeneral };
const SCREENS = { findings: drawFindings, plan: drawPlan, confirm: drawConfirm, running: drawRunning, result: drawResult, down: drawDown };
const root = document.documentElement, $ = (id) => document.getElementById(id);
let clockDrawn = '', renders = 0;

// A region is drawn again only when its markup changed, so text selected in it stays selected. `all` draws
// every region: a tick box the user just changed may show what the state does not.
const painted = { nav: '', top: '', page: '', tray: '', pane: '' };
function paint(id, markup, all) {
  const html = show(markup);
  if (!all && html === painted[id]) return false;
  $(id).innerHTML = painted[id] = html;
  return true;
}

// A scrollbar that takes room takes it from the side padding, so the rows keep their width.
const pad = (el) => { el.style.paddingRight = 32 - (el.offsetWidth - el.clientWidth) + 'px'; };

function render(all) {
  const page = $('page'), screen = S.down ? 'down' : S.screen, back = root.dataset.pane !== 'scan';
  // A section that is not shown has no scroll position of its own: the scan's is kept as it was left, for as
  // long as the scan shows the screen it was left on.
  const at = back ? S.scanTop : page.scrollTop, kept = back ? S.scanScreen === screen : root.dataset.screen === screen;
  const had = document.activeElement || {}, focus = had.id ? '#' + had.id : had.dataset && had.dataset.do ? '[data-do="' + had.dataset.do + '"]' + (had.dataset.text ? '[data-text="' + CSS.escape(had.dataset.text) + '"]' : '') : '';
  root.dataset.pane = S.pane;
  paint('nav', drawNav(), all);
  paint('top', drawTop(), all);
  if (S.pane === 'scan') {
    if (paint('page', SCREENS[screen](), all)) for (const box of page.querySelectorAll('[data-some]')) box.indeterminate = true;
    paint('tray', drawTray(), all);
    pad(page);
    page.scrollTop = kept ? at : 0;
  } else {
    paint('pane', SECTIONS[S.pane](), all);
    pad($('pane'));
  }
  if (focus && document.querySelector(focus)) document.querySelector(focus).focus();
  if (S.pane === 'scan' && screen === 'running' && page.querySelector('.fresh')) page.querySelector('.fresh').scrollIntoView({ block: 'nearest' });
  clockDrawn = clock();
  root.dataset.screen = screen;
  root.dataset.scan = S.scan ? S.scan.phase : '';
  // Tells whoever drives the page that this state is on screen, and that the page has nothing left to send
  // by itself: it is empty while a tick-box change waits to go out.
  root.dataset.settled = counting ? '' : ++renders;
}

// What the page says about the plan's time left; the page is drawn again only when that changes.
const clock = () => (!S.plan || S.down || (S.screen !== 'plan' && S.screen !== 'confirm') ? '' : expired(S.plan) ? 'old' : within(S.plan));
setInterval(() => {
  if (clock() === 'old' && S.screen === 'confirm') S.screen = 'plan';
  if (clock() !== clockDrawn) render();
}, 1000);

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-do]');
  if (!el || !act[el.dataset.do]) return;
  act[el.dataset.do](el);
  render();
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.tick) toggle(e.target);
  else if (e.target.id === 'read' && S.screen === 'confirm') S.read = e.target.checked;
  render(true);
});
// Return never runs the plan: on the confirm step it does nothing at all.
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && S.screen === 'confirm') e.preventDefault(); }, true);

render();
post({ shell: 'ready' });
</script>
</body>
</html>
