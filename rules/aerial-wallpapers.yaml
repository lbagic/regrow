# 4K aerial screensaver/wallpaper videos — full set ~64GB. Path moved
# between Sequoia and Tahoe (docs/research/02 §10, §14): idleassetsd
# system dir through macOS 15, wallpaper.agent container from 26.
# A raw `find … -delete` as root has no Trash and no undo, which
# invariants 2 and 4 keep regrow from running: surface-only, and the
# row gives the command to run yourself. The aerial-videos query
# (internal/scanner/tool_aerial.go) sizes the folder in two parts,
# since a video the downloader's temp folder also links frees nothing
# when only the folder's copy goes.
id: aerial-wallpapers
title: Aerial wallpaper videos
category: macos
risk: surface-only
tool_query: aerial-videos
note: "The videos come back whenever System Settings ▸ Wallpaper is opened, even with a still wallpaper. To see how to stop the downloads: `regrow doctor`."
scans: "the files in `/Library/Application Support/com.apple.idleassetsd/Customer` (macOS 15 and earlier) or `~/Library/Containers/com.apple.wallpaper.agent/Data/Library/Caches` (macOS 26 and later), with each file's link count; a file that has links outside the folder is counted apart"
regen:
  story: 'macOS downloads the aerial catalogue again when System Settings ▸ Wallpaper is opened, and any aerial selected as wallpaper or screensaver. To remove the videos yourself on macOS 15 and earlier: `sudo find "/Library/Application Support/com.apple.idleassetsd/Customer" -type f -name ''*.mov'' -delete`. On macOS 26 and later: `sudo find ~/Library/Containers/com.apple.wallpaper.agent/Data/Library/Caches -type f -name ''*.mov'' -delete`. A video the downloader''s temp folder also holds frees nothing until that copy goes too, and macOS 15 keeps those copies in a folder only root can read. To remove them (untested in this form): `sudo find /private/var/folders/zz -path ''*/T/com.apple.idleassetsd/CFNetworkDownload_*.tmp'' -delete`.'
  cost: n/a — regrow never deletes here; roughly 0.5 GB of download per video macOS fetches again
sudo: false
# Seen on macOS 15.7, where idleassetsd is the downloader; the row
# stays off the Tahoe path until the same is seen there.
causes:
  - check: aerial-downloads
    os_max: "25"
    title: Aerial video downloads
    story: Opening System Settings ▸ Wallpaper makes idleassetsd download the aerial catalogue (about 137 videos of roughly 0.5 GB each), even with a still wallpaper selected, and quitting System Settings does not stop a batch that is already running. Seen on macOS 15.7 — the folder went from 5 MB to 27 GB in about 90 minutes.
    fix:
      - "Quit System Settings after visiting Wallpaper, so the open pane cannot start another batch."
      - "A batch already running goes on, and the videos come back the next time the pane is opened. To stop the downloader itself:"
      - "sudo launchctl disable system/com.apple.idleassetsd   (accepted on macOS 15.7; the downloader already running goes on until a restart, and whether the setting holds after one is untested; to undo: sudo launchctl enable system/com.apple.idleassetsd)"
      - "sudo killall idleassetsd   (stops the batch that is running now)"
      - "Then remove the videos: sudo find \"/Library/Application Support/com.apple.idleassetsd/Customer\" -type f -name '*.mov' -delete"
      - "A video the downloader's temp folder also holds frees nothing until that copy goes too: sudo find /private/var/folders/zz -path '*/T/com.apple.idleassetsd/CFNetworkDownload_*.tmp' -delete   (untested in this form)"
fixture:
  items:
    - path: /Library/Application Support/com.apple.idleassetsd/Customer
      bytes: 23000000000
    - label: "16 files a link outside the folder also holds, such as the downloader's temp copies: deleting them here frees nothing"
      bytes: 11000000000
