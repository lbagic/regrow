# The Battle.net launcher's browser caches.
id: battlenet-caches
title: "Battle.net's caches"
category: app-caches
risk: safe
paths:
  darwin:
    - "~/Library/Application Support/Battle.net/BrowserCaches"
    - "~/Library/Application Support/Battle.net/Cache"
