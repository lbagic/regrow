# Simulator runtime disk images (Xcode 14+): root-owned cryptexes
# managed by simdiskimaged — never raw rm, `simctl runtime delete`
# only (docs/research/02 §6, §14). 5–10GB each.
id: sim-runtimes
title: Simulator runtimes
category: xcode
risk: caution
tool_query: simctl-runtimes
native_command: xcrun simctl runtime delete {arg}
note: Existing simulators of a deleted runtime stop booting until it is re-downloaded.
scans: "`xcrun simctl runtime list -j`, only when the developer tools `xcode-select` points at, Xcode or the Command Line Tools, are installed (without them, macOS's `xcrun` asks to install them); one row per runtime, with the size simctl reports"
keeps:
  - "runtimes simctl reports as not deletable"
regen:
  story: Xcode re-downloads a runtime on demand (Settings ▸ Components).
  cost: multi-GB download per runtime
sudo: false
fixture:
  items:
    - label: iOS 17.0 (21A328)
      arg: 11111111-2222
      bytes: 7000000000
