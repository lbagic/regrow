# Old releases of Codex's app server, which keeps every release it
# downloaded in ~/.codex/packages/app-server-daemon/releases and runs
# the one its `current` link names. The codex-releases query
# (internal/scanner/tool_superseded.go) lists every other release,
# unless a running process uses it, it is newer than the live one, or
# it changed in the last day.
id: codex-releases
title: Old Codex app server releases
category: toolchains
risk: safe
tool_query: codex-releases
# The build in use and running processes are read again right before
# each Trash move.
pre_action: superseded-build-recheck
scans: "the folders in `~/.codex/packages/app-server-daemon/releases`, with each one's newest modification time; where the `current` link beside them leads; and your processes' working folders, command lines and the files they execute or map (`lsof`, `ps`)"
keeps:
  - "the release the `current` link leads into"
  - "a release a running process executes or maps a file from, works in, or names on its command line"
  - "a release newer than the one in use, or one whose version cannot be ordered against it (no dotted version, or the same one under another name, such as a pre-release): an update may be waiting"
  - "a release with anything in it changed in the last day, and one that cannot all be read"
  - "every release when `current` is missing, leads nowhere, or leads outside the folder, since the release in use cannot be told"
  - "everything, when `lsof` or `ps` fails: the rule then shows an error and offers nothing"
regen:
  story: Codex downloads the release it needs when it updates; an old one is never run again.
  cost: nothing unless you roll Codex back; then a download
sudo: false
beta: true
fixture:
  items:
    - label: Codex app server 0.160.1-aarch64-apple-darwin
      path: ~/.codex/packages/app-server-daemon/releases/0.160.1-aarch64-apple-darwin
      bytes: 320000000
