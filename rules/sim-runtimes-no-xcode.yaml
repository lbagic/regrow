# Simulator runtimes left on disk after Xcode went: 5–10 GB each, in
# root-owned folders that simdiskimaged manages. With Xcode gone `xcrun`
# finds no simctl, so sim-runtimes lists nothing; the
# sim-runtimes-no-xcode query (internal/scanner/tool_simruntime.go)
# then lists them through the simctl CoreSimulator keeps outside Xcode.
# While xcrun finds simctl, or an Xcode app is installed, it lists
# nothing, so the two rules never list the same runtime.
#
# That simctl deletes a runtime without Xcode and without a password
# (simdiskimaged does the work), but it returns before the image is
# gone. The command therefore waits until `runtime list -j` stops
# naming the runtime, so the run ends with the space free.
id: sim-runtimes-no-xcode
title: Simulator runtimes (no Xcode)
category: xcode
risk: caution
tool_query: sim-runtimes-no-xcode
native_command:
  - /bin/sh
  - -c
  - '"$1" runtime delete "$2" || exit; n=0; while out=$("$1" runtime list -j); do case $out in *"$2"*) ;; *) exit 0;; esac; n=$((n+1)); if [ "$n" -ge 600 ]; then echo "runtime $2 is still listed after 600 listings a second apart" >&2; exit 1; fi; sleep 1; done; echo "simctl runtime list failed after the delete" >&2; exit 1'
  - sh
  - /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl
  - "{arg}"
note: "Deleted with the simctl Xcode left behind, which needs no password; the run waits until that simctl no longer lists the runtime. To see what it lists: `/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl runtime list`. Simulators of a deleted runtime stop booting until it is downloaded again."
scans: "`xcrun --find simctl`; the apps named like Xcode in `/Applications` and `~/Applications` and one folder down, with their `Info.plist`; Spotlight (`mdfind` for Xcode's bundle identifier); only when none of these finds Xcode, `simctl runtime list -j` from CoreSimulator's own copy, `/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl`; and, only when that lists a runtime, whether Spotlight indexes the startup disk (`mdutil -s` of `/` and `/System/Volumes/Data`) and LaunchServices' register of bundles (`lsregister -dump Bundle`, a few seconds), for an Xcode anywhere else"
keeps:
  - "every runtime while `xcrun` finds `simctl`, when `sim-runtimes` lists them, or an Xcode is found: in the Applications folders or one folder down, by Spotlight, or in LaunchServices' register, still on disk or on a disk not mounted now; with an Xcode installed but `xcode-select` pointing at the Command Line Tools, neither rule lists them"
  - "every runtime when an Xcode-named app, an Applications folder or a link there cannot be read or followed, when Spotlight gives no answer or does not index the startup disk, or when LaunchServices' register cannot be read, since an Xcode cannot then be ruled out"
regen:
  story: Xcode downloads a runtime again when a simulator needs it (Settings ▸ Components).
  cost: a 5–10 GB download per runtime if one is needed again
sudo: false
beta: true
fixture:
  items:
    - label: iOS 18.3 (22D8075)
      arg: 11111111-2222
      bytes: 8700000000
